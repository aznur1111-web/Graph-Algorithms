{id:"planarity",title:"Planarity testing",level:5,kind:"Structural property",status:"Concept lesson",
 summary:"A graph is planar if it can be drawn on a plane without edge crossings. Kuratowski's theorem says a graph is planar iff it does not contain K5 or K3,3 as a minor.",
 mental:"Drawing a graph without crossing edges",
 mentalText:"Some graphs can be drawn on a piece of paper without any edges crossing. Others cannot.",
 steps:["Check the graph for forbidden minors K5 and K3,3.","Or use a linear-time planarity test (Hopcroft-Tarjan, Boyer-Myrvold).","If planar, build a planar embedding.","If not, report the obstruction."],
 pseudo:"kuratowski_planarity(G):\n  if K5 or K3,3 is a minor of G:\n    return NOT PLANAR\n  return PLANAR\n\nLinear-time tests:\n  Hopcroft-Tarjan (1974): O(V)\n  Boyer-Myrvold (2004): O(V), practical\n\nPlanarity implies:\n  E <= 3V - 6 (simple graph, V >= 3)\n  E <= 2V - 4 if bipartite",
 uses:"VLSI circuit design, map coloring, network visualization, mesh generation.",
 strength:"Linear time tests exist. Practical implementations are fast.",
 limits:"Finding the actual crossing-free embedding is more complex.",
 pitfall:"E <= 3V - 6 is necessary but not sufficient. A graph can satisfy this and still be non-planar.",
 question:"Is K5 planar?",
 answer:"No. K5 has 5 vertices and 10 edges. 3V - 6 = 9, so 10 > 9 violates the necessary condition. And by Kuratowski, K5 is non-planar.",
 demo:"none",sample:"",refs:[
  ["Hopcroft and Tarjan, Efficient planarity testing, JACM 1974","https://doi.org/10.1145/321850.321852"],
  ["Boyer and Myrvold, On the cutting edge: simplified O(n) planarity by edge addition, J. Graph Algorithms Appl. 2004","https://doi.org/10.7155/jgaa.00091"],
  ["Kuratowski, Sur le probleme des courbes gauches en topologie, Fund. Math. 1930","https://doi.org/10.4064/fm-15-1-271-283"]]},
{id:"dominator",title:"Dominator trees",level:5,kind:"Reachability structure",status:"Concept lesson",
 summary:"In a directed graph with a start vertex, a dominator of v is a vertex that every path from start to v must pass through. Dominators form a tree. The Lengauer-Tarjan algorithm finds it in nearly linear time.",
 mental:"Bottlenecks that every path must pass through",
 mentalText:"Some vertices cannot be avoided on the way to a target. Those are dominators. They form a tree rooted at the start.",
 steps:["Run DFS from the start to get a numbering.","Compute the dominator tree via iterative algorithms.","A node d dominates v if every path from start to v goes through d.","The immediate dominator idom(v) is the closest such node.","Build the tree from idom pointers."],
 pseudo:"lengauer_tarjan(G, start):\n  dfs_tree = DFS(G, start)\n  # semidominators and idoms computed iteratively\n  # using union-find with path compression\n\n  for v in reverse DFS order:\n    compute semidominator of v\n    compute immediate dominator of v\n\n  return idom tree\n\nTime: O(E * alpha(V))\nSpace: O(V)",
 uses:"Compiler optimization (SSA construction), control flow analysis, network robustness, program analysis.",
 strength:"Nearly linear time. Compact tree representation.",
 limits:"Only for a specific start vertex. Requires reachability from start.",
 pitfall:"The dominator tree is defined only for vertices reachable from the start. Unreachable vertices have no dominator.",
 question:"What is the immediate dominator of a vertex v?",
 answer:"The dominator of v that is dominated by all other dominators of v. It is the parent of v in the dominator tree.",
 demo:"none",sample:"",refs:[
  ["Lengauer and Tarjan, A fast algorithm for finding dominators in a flowgraph, ACM TOPLAS 1979","https://doi.org/10.1145/357062.357071"],
  ["Cooper, Harvey, Kennedy, A simple, fast dominance algorithm, 2001","https://www.cs.rice.edu/~keith/EMBED/dom.pdf"],
  ["Wikipedia, Dominator (graph theory)","https://en.wikipedia.org/wiki/Dominator_(graph_theory)"]]},

{id:"kernighan-lin",title:"Kernighan-Lin partitioning",level:5,kind:"Partitioning",status:"Concept lesson",
 summary:"Kernighan-Lin partitions a graph into two equal-size parts minimizing the cut. It does local moves: repeatedly swap pairs of vertices that most reduce the cut.",
 mental:"Swapping pairs of vertices to reduce the cut",
 mentalText:"Start with any balanced partition. Find the pair of vertices (one on each side) whose swap most reduces the cut. Swap them. Repeat until no improvement.",
 steps:["Start with a balanced partition of the vertices.","For each pair (a from A, b from B), compute the gain from swapping.","Swap the pair with maximum gain.","Mark both as locked.","Repeat until all vertices are locked.","Roll back to the best prefix of swaps."],
 pseudo:"kernighan_lin(G, k=2):\n  partition = random balanced partition\n  while True:\n    gains = []\n    locked = set()\n    best_cut = current_cut(partition)\n    best_prefix = []\n\n    while len(locked) < |V|:\n      best_gain = -infinity\n      best_pair = None\n      for a in A - locked:\n        for b in B - locked:\n          gain = compute_gain(a, b, partition)\n          if gain > best_gain:\n            best_gain = gain\n            best_pair = (a, b)\n      swap(a, b)\n      locked.add(a, b)\n      new_cut = current_cut(partition)\n      if new_cut < best_cut:\n        best_cut = new_cut\n        best_prefix = list of swaps so far\n\n    if no improvement: break\n    roll_back_to(best_prefix)\n\n  return partition",
 uses:"VLSI circuit partitioning, load balancing, community detection, graph clustering.",
 strength:"Simple and effective for balanced bipartition.",
 limits:"O(V^3) per pass. Two-way only; multi-way needs Fiduccia-Mattheyses or METIS.",
 pitfall:"The rolled-back prefix is essential. Without it, KL can make the cut worse.",
 question:"What is the difference between KL and Fiduccia-Mattheyses?",
 answer:"FM allows single-vertex moves with balance constraints, and uses a bucket data structure for near-linear time. KL is a special case for balanced pairs.",
 demo:"none",sample:"",refs:[
  ["Kernighan and Lin, An efficient heuristic procedure for partitioning graphs, Bell System Tech. J. 1970","https://doi.org/10.1002/j.1538-7305.1970.tb01770.x"],
  ["Fiduccia and Mattheyses, A linear-time heuristic for improving network partitions, DAC 1982","https://doi.org/10.1109/DAC.1982.1585498"],
  ["Wikipedia, Kernighan-Lin algorithm","https://en.wikipedia.org/wiki/Kernighan%E2%80%93Lin_algorithm"]]},
{id:"metis",title:"METIS and multilevel partitioning",level:5,kind:"Partitioning",status:"Concept lesson",
 summary:"METIS uses a multilevel approach: coarsen the graph by collapsing edges, partition the small graph, then uncoarsen and refine. It is the standard graph partitioning library.",
 mental:"Shrink, partition, expand",
 mentalText:"Collapse the graph into a small version, partition it, then expand back and refine. The multilevel approach is fast and high quality.",
 steps:["Coarsen: repeatedly match vertices and merge them.","Stop when the graph is small enough.","Partition the small graph.","Uncoarsen: split merged vertices and refine the partition.","Repeat refinement at each level."],
 pseudo:"metis(G, k):\n  hierarchy = [G]\n  while |current graph| > threshold:\n    matched = greedy_matching(current graph)\n    hierarchy.append(contract(matched))\n\n  partition = initial_partition(hierarchy[-1], k)\n\n  for level in reversed(hierarchy[:-1]):\n    partition = project_up(partition, level)\n    partition = refine(partition, level)\n\n  return partition\n\nTime: near-linear in |E|\nQuality: matches the best heuristics",
 uses:"VLSI design, sparse matrix ordering, parallel computing load balancing, mesh partitioning.",
 strength:"Very fast and high quality. Handles graphs with millions of vertices.",
 limits:"Heuristic. No guaranteed optimality.",
 pitfall:"The matching rule affects both speed and quality. Heavy edge matching is standard.",
 question:"Why is the multilevel approach effective?",
 answer:"Coarsening reduces the problem size. Partitioning the small graph is fast. Refinement at each level restores the detail.",
 demo:"none",sample:"",refs:[
  ["Karypis and Kumar, A fast and high quality multilevel scheme for partitioning irregular graphs, SIAM J. Sci. Comput. 1998","https://doi.org/10.1137/S1064827595287997"],
  ["Hendrickson and Leland, A multilevel algorithm for partitioning graphs, Supercomputing 1995","https://doi.org/10.1145/224170.224228"],
  ["METIS homepage","http://glaros.dtc.umn.edu/gkhome/metis/metis/overview"]]},
{id:"k-core",title:"k-core decomposition",level:4,kind:"Graph structure",status:"Runnable teaching lab",
 summary:"The k-core of a graph is the maximal subgraph where every vertex has degree at least k within the subgraph. Decomposition assigns each vertex a core number.",
 mental:"Peeling away low-degree vertices",
 mentalText:"Repeatedly remove vertices with degree < k. What remains is the k-core. The largest k for which a vertex survives is its core number.",
 steps:["Compute degrees of all vertices.","Start with k = 1.","Remove vertices with degree < k.","Update neighbours' degrees.","When no more removals, the remaining vertices form the k-core.","Increment k and repeat."],
 pseudo:"k_core_decompose(G):\n  degree = {v: degree(v) for v in V}\n  core = {v: 0 for v in V}\n  k = 0\n\n  while True:\n    k += 1\n    removed = True\n    while removed:\n      removed = False\n      for v in V:\n        if degree[v] < k and core[v] == 0:\n          core[v] = k - 1\n          for u in neighbors(v):\n            degree[u] -= 1\n          removed = True\n\n  return core\n\nLinear time: O(V + E)",
 uses:"Community detection, network analysis, influence maximization, identifying network robust cores.",
 strength:"Very fast. Reveals nested structure of networks.",
 limits:"Global property. Does not directly produce partitions.",
 pitfall:"The k-core is not the set of vertices with degree >= k. It is the maximal subgraph where all vertices have degree >= k within the subgraph.",
 question:"What is the core number of a vertex in a complete graph K5?",
 answer:"4. Every vertex has degree 4, and removing any vertex leaves K4. So the core number is 4.",
 demo:"k-core",sample:"A B\nA C\nA D\nB C\nB D\nC D\nD E\nE F\nF G",refs:[
  ["Seidman, Network structure and minimum degree, Social Networks 1983","https://doi.org/10.1016/0378-8733(83)90028-X"],
  ["Batagelj and Zaversnik, An O(m) algorithm for cores decomposition of networks, 2003","https://arxiv.org/abs/cs/0310049"],
  ["Wikipedia, Degeneracy (graph theory)","https://en.wikipedia.org/wiki/Degeneracy_(graph_theory)"]]},
{id:"leiden-infomap",title:"Leiden and Infomap",level:5,kind:"Community detection",status:"Concept lesson",
 summary:"Leiden and Infomap detect communities by optimizing a quality function. Leiden fixes a defect in Louvain. Infomap minimizes the description length of a random walk.",
 mental:"Finding groups that are more connected inside than outside",
 mentalText:"A community is a set of nodes with many edges within and few edges leaving. Quality functions measure how good a partition is.",
 steps:["Leiden: local moving, refinement, aggregation.","Refinement ensures communities are well connected.","Infomap: model a random walk and minimize the map equation.","Iterate until no improvement."],
 pseudo:"leiden(G):\n  partition = each vertex alone\n  while improvement:\n    move_nodes(partition)     # Louvain-style local moves\n    refine(partition)         # split badly connected communities\n    aggregate(G, partition)   # contract communities\n\ninfomap(G):\n  partition = each vertex alone\n  while improvement:\n    # model random walk on the graph\n    # minimize description length\n    try moving each vertex to a neighbour's community\n    try merging/splitting communities\n\nTime: near-linear in practice.",
 uses:"Social network analysis, biology, neuroscience, citation networks, urban planning.",
 strength:"High-quality communities. Leiden guarantees well-connected communities. Infomap is information-theoretically motivated.",
 limits:"Heuristic. No unique correct partition exists.",
 pitfall:"Modularity has a resolution limit. Small communities can be missed. Leiden and Infomap mitigate this.",
 question:"What is the resolution limit in modularity?",
 answer:"Small communities may be merged into larger ones even when they should be separate. This is a known limitation of modularity optimization.",
 demo:"none",sample:"",refs:[
  ["Traag, Waltman, van Eck, From Louvain to Leiden: guaranteeing well-connected communities, Scientific Reports 2019","https://doi.org/10.1038/s41598-019-41695-z"],
  ["Rosvall and Bergstrom, Maps of random walks on complex networks reveal community structure, PNAS 2008","https://doi.org/10.1073/pnas.0706851105"],
  ["Blondel et al., Fast unfolding of communities in large networks, J. Stat. Mech. 2008","https://doi.org/10.1088/1742-5468/2008/10/P10008"]]},
{id:"spectral-partitioning",title:"Spectral partitioning",level:5,kind:"Partitioning",status:"Concept lesson",
 summary:"Spectral partitioning uses the second smallest eigenvector of the graph Laplacian (Fiedler vector) to partition a graph. It minimizes the normalized cut relaxation.",
 mental:"Use the shape of the graph's vibration to split it",
 mentalText:"Compute the Laplacian, find its eigenvectors. The second eigenvector gives a natural bipartition of the graph.",
 steps:["Compute the Laplacian L = D - A.","Compute the second smallest eigenvector v2 (Fiedler vector).","Sort vertices by v2's value.","Find the threshold that minimizes the cut."],
 pseudo:"spectral_partition(G):\n  L = Laplacian(G)\n  eigenvalues, eigenvectors = eigh(L)\n  fiedler = eigenvectors[:, 1]   # second eigenvector\n  sorted_vertices = sort vertices by fiedler\n\n  # try all split points to find min cut\n  best_cut = infinity\n  for i in range(1, |V|):\n    cut = edges from sorted[:i] to sorted[i:]\n    if cut < best_cut:\n      best_cut = cut\n      best_split = i\n\n  return sorted[:best_split], sorted[best_split:]",
 uses:"Graph partitioning, community detection, image segmentation, load balancing, spectral clustering.",
 strength:"Theoretically motivated by the Cheeger inequality.",
 limits:"Eigendecomposition is O(V³) dense or O(V·E) with Lanczos. Not practical for very large graphs.",
 pitfall:"The Fiedler vector gives a real-valued embedding, not a partition. You must threshold it.",
 question:"What does the second smallest eigenvalue of the Laplacian measure?",
 answer:"It measures how connected the graph is. Zero means disconnected. Larger values mean the graph is well connected.",
 demo:"spectral",sample:"A B\nA C\nB C\nD E\nD F\nE F\nC D",refs:[
  ["Fiedler, Algebraic connectivity of graphs, Czechoslovak Math. J. 1973","https://doi.org/10.21136/CMJ.1973.101168"],
  ["Donath and Hoffman, Lower bounds for the partitioning of graphs, IBM J. Res. Dev. 1973","https://doi.org/10.1147/rd.173.0420"],
  ["von Luxburg, A tutorial on spectral clustering, Statistics and Computing 2007","https://doi.org/10.1007/s11222-007-9033-z"]]},

{id:"fruchterman-reingold",title:"Fruchterman-Reingold force-directed layout",level:4,kind:"Layout",status:"Runnable teaching lab",
 summary:"Force-directed layout places vertices so connected vertices attract and all pairs repel. Fruchterman-Reingold balances these forces with a cooling schedule to converge to a stable layout.",
 mental:"Vertices connected by springs that repel each other",
 mentalText:"Edges act like springs pulling vertices together. All vertices push each other apart. The layout settles into a balanced position.",
 steps:["Place vertices randomly.","Compute repulsive forces between all pairs.","Compute attractive forces along edges.","Move vertices by a step proportional to the net force.","Cool down: reduce step size each iteration."],
 pseudo:"fruchterman_reingold(G, iterations=50):\n  place vertices randomly in area W x H\n  k = sqrt(W * H / |V|)   # ideal distance\n\n  for i in range(iterations):\n    temp = W * (1 - i / iterations)   # cooling\n    disp = {v: (0, 0) for v in V}\n\n    # repulsion\n    for u, v in V x V, u != v:\n      delta = pos[u] - pos[v]\n      disp[u] += (delta / |delta|) * k^2 / |delta|\n\n    # attraction along edges\n    for (u, v) in E:\n      delta = pos[u] - pos[v]\n      disp[u] -= (delta / |delta|) * |delta|^2 / k\n      disp[v] += (delta / |delta|) * |delta|^2 / k\n\n    # move\n    for v in V:\n      pos[v] += (disp[v] / |disp[v]|) * min(|disp[v]|, temp)\n\n  return pos",
 uses:"Network visualization, social graph drawing, knowledge graph layout.",
 strength:"Simple, produces readable layouts.",
 limits:"O(V²) per iteration for repulsion. Does not scale to large graphs.",
 pitfall:"Cooling must be slow enough to converge. A fast schedule gives tangled layouts.",
 question:"Why is the ideal distance k = sqrt(W·H / |V|)?",
 answer:"It is the side length of a square cell in a grid that holds |V| vertices. This balances repulsion and attraction.",
 demo:"force-layout",sample:"A B\nA C\nB C\nC D\nD E\nD F\nE F",refs:[
  ["Fruchterman and Reingold, Graph drawing by force-directed placement, Software 1991","https://doi.org/10.1002/spe.4380211102"],
  ["Eades, A heuristic for graph drawing, Congressus Numerantium 1984","https://www.sciencedirect.com/science/article/abs/pii/0020019084900108"],
  ["Wikipedia, Force-directed graph drawing","https://en.wikipedia.org/wiki/Force-directed_graph_drawing"]]},
{id:"kamada-kawai",title:"Kamada-Kawai layout",level:5,kind:"Layout",status:"Concept lesson",
 summary:"Kamada-Kawai computes shortest path distances between all vertices and places them so that screen distances match graph distances. It produces high-quality layouts for small to medium graphs.",
 mental:"Place vertices so screen distance equals graph distance",
 mentalText:"Compute the shortest path between every pair. Then place vertices so their screen distance equals the graph distance.",
 steps:["Compute all-pairs shortest paths (Floyd-Warshall).","Set up the stress function.","Minimize with gradient descent or stress majorization.","Vertices with small graph distance end up close on screen."],
 pseudo:"kamada_kawai(G):\n  D = all_pairs_shortest_paths(G)\n  L = ideal_length = average of D\n  stress = 0\n\n  # initial positions: use MDS on D\n  pos = MDS(D)\n\n  while not converged:\n    for each pair (i, j):\n      delta = pos[i] - pos[j]\n      desired = L * D[i][j]\n      actual = |delta|\n      stress += (actual - desired)^2 / D[i][j]^2\n\n    update pos via gradient descent or SMACOF\n\n  return pos",
 uses:"Small to medium graph layout, sensor network localization, MDS-style embedding.",
 strength:"High-quality layout. Preserves global distances.",
 limits:"O(V²) memory for the distance matrix. O(V³) for Floyd-Warshall.",
 pitfall:"Stress majorization converges faster than gradient descent. Use it for practical implementations.",
 question:"What is the main difference between FR and KK?",
 answer:"FR uses local forces. KK uses global shortest path distances and minimizes stress. KK gives a more global layout.",
 demo:"none",sample:"",refs:[
  ["Kamada and Kawai, An algorithm for drawing general undirected graphs, Information Processing Letters 1989","https://doi.org/10.1016/0020-0190(89)90102-6"],
  ["Gansner, Koren, North, Graph drawing by stress majorization, GD 2004","https://doi.org/10.1007/978-3-540-31843-9_25"],
  ["Wikipedia, Stress majorization","https://en.wikipedia.org/wiki/Stress_majorization"]]},
{id:"sugiyama",title:"Sugiyama layered drawing",level:5,kind:"Layout",status:"Concept lesson",
 summary:"Sugiyama layout draws directed graphs in layers, so edges point downward. It is the standard for flowcharts, DAGs and dependency graphs.",
 mental:"Stacking vertices into layers so edges flow downward",
 mentalText:"Put vertices into layers. Edges only go from one layer to the next. Minimize crossings within and between layers.",
 steps:["Assign layers via longest-path or topological order.","Insert dummy vertices for edges spanning multiple layers.","Reduce crossings by reordering within layers.","Assign coordinates to avoid overlap."],
 pseudo:"sugiyama(G):\n  # 1. layer assignment\n  layers = longest_path_layering(G)\n\n  # 2. insert dummy vertices\n  for edge (u, v) spanning multiple layers:\n    insert dummy vertices at intermediate layers\n\n  # 3. crossing reduction (barycenter heuristic)\n  for each layer from top to bottom:\n    order vertices by average position of neighbours above\n  for each layer from bottom to top:\n    order vertices by average position of neighbours below\n\n  # 4. coordinate assignment (e.g. Brandes-Kopf)\n  assign_x_coordinates(layers)\n\n  return positions",
 uses:"Flowchart editors, dependency graph visualization, compiler output, build systems.",
 strength:"Clear top-down layout. Handles long edges with dummy vertices.",
 limits:"Crossing minimization is NP-hard. Heuristics are used.",
 pitfall:"Dummy vertices are essential. Without them, long edges pass through layers and look wrong.",
 question:"Why does Sugiyama insert dummy vertices?",
 answer:"To break long edges into unit-length segments. This makes crossing reduction work on each layer uniformly.",
 demo:"none",sample:"",refs:[
  ["Sugiyama, Tagawa, Toda, Methods for visual understanding of hierarchical system structures, IEEE Trans. SMC 1981","https://doi.org/10.1109/TSMC.1981.4308636"],
  ["Gansner et al., A technique for drawing directed graphs, IEEE Trans. Software Eng. 1993","https://doi.org/10.1109/32.221135"],
  ["Wikipedia, Layered graph drawing","https://en.wikipedia.org/wiki/Layered_graph_drawing"]]},
{id:"gcn",title:"Graph Convolutional Networks (GCN)",level:5,kind:"Graph learning",status:"Concept lesson",
 summary:"A GCN learns vertex representations by aggregating features from neighbours. Each layer mixes a vertex's features with the average of its neighbours' features.",
 mental:"Each vertex updates itself by averaging its neighbours",
 mentalText:"Start with vertex features. At each layer, take the average of the neighbours' features, add your own, apply a linear transform and nonlinearity.",
 steps:["Initialize vertex features X.","For each layer: aggregate neighbour features.","Apply a linear transformation W.","Apply a nonlinearity like ReLU.","Repeat for k layers to aggregate k-hop information."],
 pseudo:"gcn_layer(H, A, W):\n  # A is adjacency with self loops\n  # D is degree matrix\n  A_hat = A + I\n  D_hat = diagonal(sum of A_hat rows)\n  norm = D_hat^{-1/2} A_hat D_hat^{-1/2}\n  H_new = relu(norm @ H @ W)\n  return H_new\n\nTwo-layer GCN for node classification:\n  H1 = relu(norm @ X @ W0)\n  Z = softmax(norm @ H1 @ W1)\n  Loss = cross_entropy(Z[labelled], y[labelled])\n\nTime per layer: O(E * d)\nMemory: O(E * d) for the normalized adjacency",
 uses:"Node classification, link prediction, recommendation, molecular property prediction, knowledge graph completion.",
 strength:"Simple and effective. Scales to large graphs.",
 limits:"Over-smoothing with many layers. Cannot distinguish certain structures (limited by 1-WL).",
 pitfall:"Deep GCNs lose expressive power because all vertices become similar. Use 2-3 layers or add residuals.",
 question:"Why do GCNs use the symmetric normalized adjacency matrix?",
 answer:"It balances the contribution of high-degree and low-degree neighbours. Without normalization, high-degree vertices dominate.",
 demo:"none",sample:"",refs:[
  ["Kipf and Welling, Semi-supervised classification with graph convolutional networks, ICLR 2017","https://arxiv.org/abs/1609.02907"],
  ["Defferrard, Bresson, Vandergheynst, Convolutional neural networks on graphs with fast localized spectral filtering, NIPS 2016","https://arxiv.org/abs/1606.09375"],
  ["PyTorch Geometric documentation","https://pytorch-geometric.readthedocs.io/"]]},
{id:"gat",title:"Graph Attention Networks (GAT)",level:5,kind:"Graph learning",status:"Concept lesson",
 summary:"GAT uses attention to weight neighbour contributions. Instead of averaging uniformly, it learns how much each neighbour matters for each vertex.",
 mental:"Learning which neighbours to trust",
 mentalText:"Each vertex computes attention scores to its neighbours. Higher scores mean the neighbour's features contribute more to the vertex's new representation.",
 steps:["For each edge, compute an attention score.","Normalize scores across neighbours with softmax.","Aggregate neighbours weighted by attention.","Apply a linear transform and nonlinearity.","Use multiple heads and concatenate or average."],
 pseudo:"gat_layer(H, A, W):\n  # H: vertex features, A: adjacency\n  H_W = H @ W\n  for each edge (i, j):\n    e_ij = leaky_relu(a . (H_W[i] || H_W[j]))\n  alpha = softmax over neighbours j of e_ij\n  H_new = sum over j of alpha_ij * H_W[j]\n\nMulti-head:\n  heads = [gat_layer(H, A, W_k) for k in range(K)]\n  H_new = concat(heads) or average(heads)\n\nTime per layer: O(E * d)",
 uses:"Node classification, link prediction, molecule property prediction, relation extraction.",
 strength:"Learns edge importance. Better than GCN on heterogeneous graphs.",
 limits:"Higher computational cost than GCN. Attention scores can be noisy on sparse graphs.",
 pitfall:"Attention over many neighbours can drown out the signal. Multi-head attention helps stabilize.",
 question:"How does GAT differ from GCN?",
 answer:"GCN weights all neighbours by degree-normalized uniform weights. GAT learns a weight (attention) for each edge.",
 demo:"none",sample:"",refs:[
  ["Velickovic et al., Graph Attention Networks, ICLR 2018","https://arxiv.org/abs/1710.10903"],
  ["Bahdanau, Cho, Bengio, Neural machine translation by jointly learning to align and translate, ICLR 2015","https://arxiv.org/abs/1409.0473"],
  ["PyTorch Geometric GAT documentation","https://pytorch-geometric.readthedocs.io/en/latest/modules/nn.html#torch_geometric.nn.conv.GATConv"]]},
{id:"graphsage",title:"GraphSAGE",level:5,kind:"Graph learning",status:"Concept lesson",
 summary:"GraphSAGE samples a fixed number of neighbours per vertex and aggregates their features. This makes it scale to large graphs by avoiding full-neighbourhood computation.",
 mental:"Sample a few neighbours and combine",
 mentalText:"For each vertex, sample a fixed number of neighbours. Aggregate their features with mean, LSTM or pooling. Combine with the vertex's own features.",
 steps:["Sample K neighbours per vertex (fixed K).","Aggregate sampled neighbours' features.","Concatenate with the vertex's own features.","Apply a linear transform and nonlinearity.","Repeat for L layers."],
 pseudo:"graphsage_layer(H, neighbors_sampled, W_self, W_neigh):\n  agg = aggregate(H[neighbors_sampled])    # mean, LSTM, pool\n  h_new = relu(W_self @ H[v] + W_neigh @ agg)\n  return h_new\n\nForward pass with L layers:\n  H^0 = X\n  for l in 1..L:\n    for v in V:\n      sampled = random_sample(neighbors(v), K)\n      H^l[v] = graphsage_layer(H^{l-1}[v], sampled)\n\nTime per layer: O(|V| * K * d)\nIndependent of graph density.",
 uses:"Large-scale node classification, recommender systems (Pinterest PinSage), inductive learning on new vertices.",
 strength:"Scales to billion-edge graphs. Inductive: can embed new vertices without retraining.",
 limits:"Sampling introduces variance. Requires tuning of K and aggregation function.",
 pitfall:"Fixed-size sampling means the aggregation is different each epoch. This is intentional but adds noise.",
 question:"Why is GraphSAGE inductive?",
 answer:"It learns aggregation functions, not per-vertex embeddings. New vertices can be embedded using the same aggregation without retraining.",
 demo:"none",sample:"",refs:[
  ["Hamilton, Ying, Leskovec, Inductive representation learning on large graphs, NIPS 2017","https://arxiv.org/abs/1706.02216"],
  ["Ying et al., PinSage: graph convolutional neural networks for web-scale recommender systems, KDD 2018","https://arxiv.org/abs/1806.01973"],
  ["PyTorch Geometric GraphSAGE documentation","https://pytorch-geometric.readthedocs.io/en/latest/modules/nn.html#torch_geometric.nn.conv.SAGEConv"]]}

 "spectral":{python:`import numpy as np\n\n\ndef spectral_partition(adj, verts):\n    n = len(verts)\n    idx = {v: i for i, v in enumerate(verts)}\n    A = np.zeros((n, n))\n    for u in adj:\n        for v in adj[u]:\n            A[idx[u]][idx[v]] = 1\n    D = np.diag(A.sum(axis=1))\n    L = D - A\n    vals, vecs = np.linalg.eigh(L)\n    fiedler = vecs[:, 1]\n    order = np.argsort(fiedler)\n    # try splits\n    best_cut, best_split = float("inf"), 0\n    for k in range(1, n):\n        left = set(verts[i] for i in order[:k])\n        cut = sum(1 for u in left for v in adj[u] if v not in left)\n        if cut < best_cut:\n            best_cut = cut\n            best_split = k\n    left = [verts[i] for i in order[:best_split]]\n    right = [verts[i] for i in order[best_split:]]\n    return left, right, best_cut\n\n\nadj = {"A": ["B", "C"], "B": ["A", "C"], "C": ["A", "B", "D"], "D": ["C", "E", "F"], "E": ["D", "F"], "F": ["D", "E"]}\nprint(spectral_partition(adj, list(adj)))\n`},
 "force-layout":{python:`import math, random\n\n\ndef fruchterman_reingold(edges, verts, iterations=50, W=800, H=600):\n    random.seed(42)\n    pos = {v: [random.uniform(0, W), random.uniform(0, H)] for v in verts}\n    k = math.sqrt(W * H / len(verts))\n    for it in range(iterations):\n        temp = W * (1 - it / iterations)\n        disp = {v: [0.0, 0.0] for v in verts}\n        # repulsion\n        for u in verts:\n            for v in verts:\n                if u == v: continue\n                dx = pos[u][0] - pos[v][0]\n                dy = pos[u][1] - pos[v][1]\n                d = max(0.01, math.hypot(dx, dy))\n                force = k * k / d\n                disp[u][0] += dx / d * force\n                disp[u][1] += dy / d * force\n        # attraction\n        for u, v in edges:\n            dx = pos[u][0] - pos[v][0]\n            dy = pos[u][1] - pos[v][1]\n            d = max(0.01, math.hypot(dx, dy))\n            force = d * d / k\n            disp[u][0] -= dx / d * force\n            disp[u][1] -= dy / d * force\n            disp[v][0] += dx / d * force\n            disp[v][1] += dy / d * force\n        # move\n        for v in verts:\n            d = max(0.01, math.hypot(*disp[v]))\n            pos[v][0] += disp[v][0] / d * min(d, temp)\n            pos[v][1] += disp[v][1] / d * min(d, temp)\n    return pos\n\n\nedges = [("A","B"), ("A","C"), ("B","C"), ("C","D"), ("D","E"), ("D","F"), ("E","F")]\nverts = list(set(v for e in edges for v in e))\npos = fruchterman_reingold(edges, verts)\nfor v in verts:\n    print(v, pos[v])\n`},
};

/* ============================================================
   Graph parsing and utilities
   ============================================================ */
function parseGraph(text, directed=false){
 const lines=text.trim().split(/\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
 const adj={};
 const neighbors=u=>{if(!adj[u])adj[u]=[];return adj[u]};
 let start=null, source=null, target=null, sink=null, root=null;
 const edges=[];
 const queries=[];
 for(const line of lines){
  const p=line.split(/\s+/);
  const key=p[0].toLowerCase();
  if((key==='start'||key==='source')&&p[1]){start=p[1];source=source||p[1];neighbors(p[1]);continue}
  if(key==='sink'&&p[1]){sink=p[1];neighbors(p[1]);continue}
  if(key==='target'&&p[1]){target=p[1];neighbors(p[1]);continue}
  if(key==='root'&&p[1]){root=p[1];neighbors(p[1]);continue}
  if(key==='query'&&p.length>=3){queries.push([p[1],p[2]]);neighbors(p[1]);neighbors(p[2]);continue}
  if(key==='h'&&p.length>=3){if(!adj._h)adj._h={};adj._h[p[1]]=Number(p[2]);neighbors(p[1]);continue}
  if(p.length>=2&&p[0]&&p[1]){
   const u=p[0], v=p[1];
   const w=p.length>=3?Number(p[2]):1;
   neighbors(u);neighbors(v);
   edges.push([u,v,Number.isFinite(w)?w:1]);
   adj[u].push([v,w]);
   if(!directed)adj[v].push([u,w]);
  }
 }
 return {adj,edges,start:start||source||Object.keys(adj).filter(k=>k!=='_h')[0],source,target,sink,root,queries,h:adj._h||{}};
}
function graphSVG(positions,edges,opts={}){
 const {highlight=new Set(),width=700,height=400}=opts;
 const xs=Object.values(positions).map(p=>p[0]);
 const ys=Object.values(positions).map(p=>p[1]);
 const minX=Math.min(...xs),maxX=Math.max(...xs);
 const minY=Math.min(...ys),maxY=Math.max(...ys);
 const sx=v=>((v-minX)/(maxX-minX||1))*(width-60)+30;
 const sy=v=>((v-minY)/(maxY-minY||1))*(height-60)+30;
 let out='';
 for(const[u,v] of edges){
  if(!positions[u]||!positions[v])continue;
  const hl=highlight.has(u+'-'+v)||highlight.has(v+'-'+u);
  out+=`<line x1="${sx(positions[u][0]).toFixed(1)}" y1="${sy(positions[u][1]).toFixed(1)}" x2="${sx(positions[v][0]).toFixed(1)}" y2="${sy(positions[v][1]).toFixed(1)}" stroke="${hl?'var(--accent)':'var(--line2)'}" stroke-width="${hl?3:1.5}"/>`;
 }
 for(const n of Object.keys(positions)){
  out+=`<circle cx="${sx(positions[n][0]).toFixed(1)}" cy="${sy(positions[n][1]).toFixed(1)}" r="16" fill="var(--panel2)" stroke="var(--accent)" stroke-width="2"/>`;
  out+=`<text x="${sx(positions[n][0]).toFixed(1)}" y="${sy(positions[n][1])+4}" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--strong)">${n}</text>`;
 }
 return `<svg class="graph-svg" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
function circleLayout(vertices,R=140,cx=350,cy=200){
 const out={};
 const n=vertices.length;
 vertices.forEach((v,i)=>{
  const a=2*Math.PI*i/n-Math.PI/2;
  out[v]=[cx+R*Math.cos(a),cy+R*Math.sin(a)];
 });
 return out;
}

function demoGraphViewer(text){

 const rows=verts.map(v=>`  ${v}: [${adj[v].map(([w,w2])=>w).sort().join(', ')}]`);
 // adjacency matrix
 const n=verts.length;
 const idx=Object.fromEntries(verts.map((v,i)=>[v,i]));
 const M=Array.from({length:n},()=>new Array(n).fill(0));
 for(const[u,v,w] of edges){M[idx[u]][idx[v]]=w;M[idx[v]][idx[u]]=w}
 const mat=verts.map((v,i)=>`  ${v}: [${M[i].map(x=>String(x).padStart(2)).join(' ')}]`);
 const pos=circleLayout(verts);
 const svg=graphSVG(pos,edges.map(e=>[e[0],e[1]]));
 return {
  encoded:`Vertices: ${n}\nEdges: ${edges.length}\n\nAdjacency list:\n${rows.join('\n')}\n\nAdjacency matrix:\n${mat.join('\n')}`,
  html:svg,
  decoded:`An adjacency list stores neighbours per vertex. It is O(V+E) space and efficient for sparse graphs.\n\nAn adjacency matrix stores a V×V table. It is O(V²) space but gives O(1) edge lookup. Use it for dense graphs or when you frequently test edges.`
 };
}
function demoBfsDfs(text){
 const {adj,start}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const s=start||verts[0];
 const bfsOrder=[],seen=new Set([s]);
 const q=[s];
 while(q.length){const u=q.shift();bfsOrder.push(u);for(const[v] of adj[u]||[]){if(!seen.has(v)){seen.add(v);q.push(v)}}}
 const dfsOrder=[],dseen=new Set();
 const stack=[s];
 while(stack.length){const u=stack.pop();if(dseen.has(u))continue;dseen.add(u);dfsOrder.push(u);for(let i=(adj[u]||[]).length-1;i>=0;i--){const[v]=adj[u][i];if(!dseen.has(v))stack.push(v)}}
 const pos=circleLayout(verts);
 return {
  encoded:`Start: ${s}\n\nBFS order: ${bfsOrder.join(' → ')}\n\nDFS order: ${dfsOrder.join(' → ')}`,
  html:graphSVG(pos,Object.values(adj).flatMap((n,u)=>n.map(([v])=>[Object.keys(adj)[u],v]))),
  decoded:`BFS uses a queue and explores level by level. It finds shortest paths in unweighted graphs.\n\nDFS uses a stack (or recursion) and explores as deep as possible. It is the base of SCC, articulation points and topological sort.\n\nBoth are O(V + E).`
 };
}
function demoComponents(text){
 const {adj}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const seen=new Set();
 const comps=[];
 for(const v of verts){
  if(seen.has(v))continue;
  const comp=[];
  const q=[v];seen.add(v);
  while(q.length){const u=q.shift();comp.push(u);for(const[w] of adj[u]||[]){if(!seen.has(w)){seen.add(w);q.push(w)}}}
  comps.push(comp.sort());
 }
 // bipartite check
 const color={};let bipartite=true;
 for(const v of verts){
  if(color[v]!==undefined)continue;
  color[v]=0;const q=[v];
  while(q.length&&bipartite){const u=q.shift();for(const[w] of adj[u]||[]){if(color[w]===undefined){color[w]=1-color[u];q.push(w)}else if(color[w]===color[u]){bipartite=false;break}}}
  if(!bipartite)break;
 }
 const pos=circleLayout(verts);
 return {
  encoded:`Components: ${comps.length}\n${comps.map((c,i)=>`  Component ${i+1}: [${c.join(', ')}]`).join('\n')}\n\nBipartite: ${bipartite?'YES':'NO'}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Connected components partition an undirected graph into maximal reachable groups. A BFS or DFS from each unvisited vertex finds all components.\n\nA graph is bipartite if its vertices can be 2-coloured so no edge has both ends the same colour. Equivalent to: no odd-length cycles.`
 };
}
function demoTopoSort(text){
 const {adj}=parseGraph(text,true);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const indeg={};
 verts.forEach(v=>indeg[v]=0);
 for(const u of verts)for(const[v] of adj[u]||[])indeg[v]=(indeg[v]||0)+1;
 const q=verts.filter(v=>indeg[v]===0);
 const order=[];
 while(q.length){
  const u=q.shift();
  order.push(u);
  for(const[v] of adj[u]||[]){indeg[v]--;if(indeg[v]===0)q.push(v)}
 }
 const pos=circleLayout(verts);
 return {
  encoded:order.length===verts.length?`Topological order:\n  ${order.join(' → ')}`:`Cycle detected. Processed ${order.length} of ${verts.length} vertices.`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Kahn's algorithm builds an order by repeatedly taking a vertex with no remaining incoming edges. If a cycle exists, some vertices never reach in-degree 0 and are excluded from the order.`
 };
}
function demoCycleDetect(text){
 const {adj}=parseGraph(text,true);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const color={};
 let cycle=false;
 let cyclePath=null;
 function dfs(u,path){
  color[u]=1;
  path.push(u);
  for(const[v] of adj[u]||[]){
   if(color[v]===1){cycle=true;cyclePath=[...path.slice(path.indexOf(v)),v];return true}
   if(!color[v]&&dfs(v,path))return true;
  }
  color[u]=2;
  path.pop();
  return false;
 }
 for(const v of verts)if(!color[v]&&dfs(v,[]))break;
 const pos=circleLayout(verts);
 return {
  encoded:cycle?`Cycle detected: ${cyclePath.join(' → ')}`:`No cycle. Graph is a DAG.`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Three-colour DFS: white (unvisited), grey (on current path), black (finished). An edge to a grey vertex is a back edge that closes a cycle.`
 };
}
function demoScc(text){
 const {adj}=parseGraph(text,true);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const indices={},lowlink={},onStack=new Set(),stack=[];
 let idx=0;const sccs=[];
 function strongconnect(v){
  indices[v]=lowlink[v]=idx++;
  stack.push(v);onStack.add(v);
  for(const[w] of adj[v]||[]){
   if(indices[w]===undefined){strongconnect(w);lowlink[v]=Math.min(lowlink[v],lowlink[w])}
   else if(onStack.has(w))lowlink[v]=Math.min(lowlink[v],indices[w]);
  }
  if(lowlink[v]===indices[v]){
   const scc=[];
   while(true){const w=stack.pop();onStack.delete(w);scc.push(w);if(w===v)break}
   sccs.push(scc.sort());
  }
 }
 for(const v of verts)if(indices[v]===undefined)strongconnect(v);
 const pos=circleLayout(verts);
 return {
  encoded:`SCCs: ${sccs.length}\n${sccs.map((s,i)=>`  ${i+1}: [${s.join(', ')}]`).join('\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Tarjan's algorithm finds SCCs in one DFS pass. An SCC is a maximal set of vertices where every vertex can reach every other.`
 };
}
function demoDijkstra(text){
 const {adj,source}=parseGraph(text,false);
 const s=source||Object.keys(adj).filter(k=>k!=='_h')[0];
 const dist={},prev={};
 for(const k of Object.keys(adj)){if(k==='_h')continue;dist[k]=Infinity}
 dist[s]=0;
 const pq=[[0,s]];
 while(pq.length){
  pq.sort((a,b)=>a[0]-b[0]);
  const[d,u]=pq.shift();
  if(d>dist[u])continue;
  for(const[v,w] of adj[u]||[]){
   const nd=dist[u]+w;
   if(nd<dist[v]){dist[v]=nd;prev[v]=u;pq.push([nd,v])}
  }
 }
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const rows=verts.map(v=>`  ${v}: ${dist[v]===Infinity?'∞':dist[v]}`);
 const pos=circleLayout(verts);
 return {
  encoded:`Source: ${s}\n\nShortest distances:\n${rows.join('\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Dijkstra uses a priority queue to always expand the closest unfinished vertex. Requires non-negative edge weights. Complexity O((V + E) log V) with a binary heap.`
 };
}
function demoBellmanFord(text){
 const {adj,source}=parseGraph(text,true);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const edges=[];
 for(const u of verts)for(const[v,w] of adj[u]||[])edges.push([u,v,w]);
 const s=source||verts[0];
 const dist={};
 verts.forEach(v=>dist[v]=Infinity);
 dist[s]=0;
 for(let i=0;i<verts.length-1;i++){
  let updated=false;
  for(const[u,v,w] of edges){
   if(dist[u]+w<dist[v]){dist[v]=dist[u]+w;updated=true}
  }
  if(!updated)break;
 }
 let negCycle=false;
 for(const[u,v,w] of edges)if(dist[u]+w<dist[v])negCycle=true;
 const rows=verts.map(v=>`  ${v}: ${dist[v]===Infinity?'∞':dist[v]}`);
 const pos=circleLayout(verts);
 return {
  encoded:`Source: ${s}\n${negCycle?'NEGATIVE CYCLE DETECTED':''}\n\nDistances:\n${rows.join('\n')}`,
  html:graphSVG(pos,edges.map(([u,v])=>[u,v])),
  decoded:`Bellman-Ford relaxes every edge V-1 times. After that, one more pass detects negative cycles. Works with negative weights (unlike Dijkstra). Complexity O(V·E).`
 };
}
function demoFloyd(text){

 const n=verts.length;const idx=Object.fromEntries(verts.map((v,i)=>[v,i]));

 for(let i=0;i<n;i++)D[i][i]=0;
 for(const u of verts)for(const[v,w] of adj[u]||[])D[idx[u]][idx[v]]=w;
 for(let k=0;k<n;k++)for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(D[i][k]+D[k][j]<D[i][j])D[i][j]=D[i][k]+D[k][j];
 const header='     '+verts.map(v=>v.padStart(4)).join(' ');

 return {
  encoded:`All-pairs shortest paths:\n${header}\n${rows.join('\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),

 };

function demoMst(text){
 const {adj,edges}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const sorted=[...edges].sort((a,b)=>a[2]-b[2]);
 const parent={};verts.forEach(v=>parent[v]=v);
 function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
 function union(a,b){const ra=find(a),rb=find(b);if(ra===rb)return false;parent[ra]=rb;return true}
 const mst=[];let total=0;
 for(const[u,v,w] of sorted)if(union(u,v)){mst.push([u,v,w]);total+=w}
 const pos=circleLayout(verts);
 const used=new Set(mst.map(([u,v])=>u+'-'+v).concat(mst.map(([u,v])=>v+'-'+u)));
 return {
  encoded:`MST edges (${mst.length}, total weight ${total}):\n${mst.map(([u,v,w])=>`  ${u} — ${v}  (${w})`).join('\n')}`,
  html:graphSVG(pos,edges.map(e=>[e[0],e[1]]),{highlight:used}),
  decoded:`Kruskal sorts edges by weight and adds each one if it does not create a cycle. Union-find detects cycles in nearly O(1). The result is a minimum spanning tree.`
 };
}
function demoUnionFind(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const parent={};const output=[];
 function find(x){if(!(x in parent))parent[x]=x;while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x]}return x}
 function union(a,b){const ra=find(a),rb=find(b);if(ra===rb){output.push(`union(${a},${b}): already same set`);return false}parent[ra]=rb;output.push(`union(${a},${b}): merged`);return true}
 for(const line of lines){
  const p=line.split(/\s+/);
  if(p[0]==='union')union(p[1],p[2]);
  else if(p[0]==='find')output.push(`find(${p[1]}) = ${find(p[1])}`);
 }
 const sets={};
 for(const x of Object.keys(parent)){const r=find(x);(sets[r]=sets[r]||[]).push(x)}
 const setLines=Object.entries(sets).map(([r,members])=>`  ${r}: {${members.join(', ')}}`);
 return {
  encoded:`Operations:\n${output.map(o=>'  '+o).join('\n')}\n\nFinal sets:\n${setLines.join('\n')}`,
  decoded:`Union-find maintains disjoint sets under union and find. Path compression and union by rank give nearly O(1) amortized time per operation.`
 };
}
function demoBridges(text){
 const {adj}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const disc={},low={},bridges=[];
 let time=0;
 function dfs(u,p){
  disc[u]=low[u]=time++;
  for(const[v] of adj[u]||[]){
   if(v===p)continue;
   if(disc[v]===undefined){dfs(v,u);low[u]=Math.min(low[u],low[v]);if(low[v]>disc[u])bridges.push([u,v])}
   else low[u]=Math.min(low[u],disc[v]);
  }
 }
 for(const v of verts)if(disc[v]===undefined)dfs(v,null);
 const pos=circleLayout(verts);

  decoded:`An edge is a bridge if removing it disconnects the graph. The DFS low-link value of a child must exceed the discovery time of its parent.`
 };
}
function demoMaxFlow(text){

  paths.push(`${path.join('→')}  bottleneck ${bottleneck}`);
 }
 const pos=circleLayout(verts);
 return {
  encoded:`Max flow from ${s} to ${t}: ${flow}\n\nAugmenting paths:\n${paths.map(p=>'  '+p).join('\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Edmonds-Karp uses BFS to find shortest augmenting paths. Each augmentation adds at least one unit of flow. With BFS the algorithm is O(V · E²).`
 };
}
function demoEulerPath(text){
 const {adj,start}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const odds=verts.filter(v=>(adj[v]||[]).length%2===1);
 const s=start||(odds.length>0?odds[0]:verts[0]);
 // clone adjacency as edge lists
 const local={};verts.forEach(v=>local[v]=(adj[v]||[]).map(([w])=>w));
 function hasEdges(v){return local[v]&&local[v].length>0}
 const stack=[s],path=[];
 while(stack.length){
  const u=stack[stack.length-1];
  if(hasEdges(u)){
   const v=local[u].pop();
   local[v]=local[v].filter(x=>x!==u);
   stack.push(v);
  } else {
   path.push(stack.pop());
  }
 }
 path.reverse();
 const pos=circleLayout(verts);
 return {
  encoded:`Odd-degree vertices: ${odds.length} ${odds.length?'('+odds.join(', ')+')':''}\n\nEuler ${odds.length===2?'path':'circuit'} from ${s}:\n  ${path.join(' → ')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Hierholzer's algorithm builds an Euler path in O(E). It requires either 0 or 2 odd-degree vertices for an undirected graph.`
 };
}
function demoLca(text){
 const {adj,root,queries}=parseGraph(text,false);
 const r=root||Object.keys(adj).filter(k=>k!=='_h')[0];
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const depth={};const up=[];
 const LOG=Math.max(1,Math.ceil(Math.log2(verts.length+1)));
 verts.forEach(v=>up.push ? null : null);
 const idx=Object.fromEntries(verts.map((v,i)=>[v,i]));
 const table=Array.from({length:LOG},()=>new Array(verts.length).fill(0));
 depth[r]=0;
 const q=[r];const seen=new Set([r]);
 while(q.length){
  const u=q.shift();
  for(const[v] of adj[u]||[]){
   if(!seen.has(v)){seen.add(v);depth[v]=depth[u]+1;table[0][idx[v]]=idx[u];q.push(v)}
  }
 }
 for(const v of verts)if(!(v in depth)){depth[v]=0;table[0][idx[v]]=idx[v]}
 for(let k=1;k<LOG;k++)for(let i=0;i<verts.length;i++)table[k][i]=table[k-1][table[k-1][i]];
 function lca(a,b){
  let ia=idx[a],ib=idx[b];
  if(depth[a]<depth[b]){[ia,ib]=[ib,ia];[a,b]=[b,a]}
  const diff=depth[a]-depth[b];
  for(let k=0;k<LOG;k++)if(diff&(1<<k))ia=table[k][ia];
  if(ia===ib)return verts[ia];
  for(let k=LOG-1;k>=0;k--)if(table[k][ia]!==table[k][ib]){ia=table[k][ia];ib=table[k][ib]}
  return verts[table[0][ia]];
 }
 const rows=queries.map(([a,b])=>`  LCA(${a}, ${b}) = ${lca(a,b)}`);
 const pos=circleLayout(verts);
 return {
  encoded:`Root: ${r}\n\nQueries:\n${rows.join('\n')||'  (no queries in input)'}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`Binary lifting precomputes 2^k ancestors for each vertex. LCA queries take O(log n) time. Preprocessing is O(n log n).`
 };
}
function demoKCore(text){
 const {adj}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const degree={};verts.forEach(v=>degree[v]=(adj[v]||[]).length);
 const remaining=new Set(verts);
 const core={};
 let k=0;
 while(remaining.size){
  k++;
  let changed=true;
  while(changed){
   changed=false;
   for(const v of [...remaining]){
    if(degree[v]<k){
     core[v]=k-1;
     remaining.delete(v);
     for(const[u] of adj[v]||[])if(remaining.has(u))degree[u]--;
     changed=true;
    }
   }
  }
 }
 const rows=verts.map(v=>`  ${v}: core number ${core[v]}`);
 const pos=circleLayout(verts);
 return {
  encoded:`Core numbers:\n${rows.join('\n')}\n\nMax core: ${Math.max(...Object.values(core))}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`The k-core is the maximal subgraph where every vertex has degree ≥ k. Repeatedly peeling low-degree vertices gives the core numbers. Runs in O(V + E).`
 };
}
function demoForceLayout(text){
 const {adj,edges}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const W=700,H=400;
 const pos={};
 // deterministic circle seed
 const c=circleLayout(verts,120,W/2,H/2);
 verts.forEach(v=>pos[v]=[c[v][0],c[v][1]]);
 const k=Math.sqrt(W*H/verts.length);
 for(let it=0;it<80;it++){
  const temp=W*(1-it/80)/3;
  const disp={};verts.forEach(v=>disp[v]=[0,0]);
  for(const u of verts)for(const v of verts){
   if(u===v)continue;
   const dx=pos[u][0]-pos[v][0],dy=pos[u][1]-pos[v][1];
   const d=Math.max(0.1,Math.hypot(dx,dy));
   const f=k*k/d;
   disp[u][0]+=dx/d*f;disp[u][1]+=dy/d*f;
  }
  for(const[u,v] of edges.map(e=>[e[0],e[1]])){
   const dx=pos[u][0]-pos[v][0],dy=pos[u][1]-pos[v][1];
   const d=Math.max(0.1,Math.hypot(dx,dy));
   const f=d*d/k;
   disp[u][0]-=dx/d*f;disp[u][1]-=dy/d*f;
   disp[v][0]+=dx/d*f;disp[v][1]+=dy/d*f;
  }
  for(const v of verts){
   const d=Math.max(0.1,Math.hypot(disp[v][0],disp[v][1]));
   pos[v][0]+=disp[v][0]/d*Math.min(d,temp);
   pos[v][1]+=disp[v][1]/d*Math.min(d,temp);
  }
 }
 return {
  encoded:`Laid out ${verts.length} vertices, ${edges.length} edges.`,
  html:graphSVG(pos,edges.map(e=>[e[0],e[1]])),
  decoded:`Fruchterman-Reingold: connected vertices attract, all pairs repel. A cooling schedule reduces the step size each iteration. O(V²) per iteration.`
 };
}
function demoPrufer(text){
 const {edges}=parseGraph(text,false);
 const verts=[...new Set(edges.flatMap(e=>[e[0],e[1]]))].sort();
 const adj={};
 verts.forEach(v=>adj[v]=new Set());
 for(const[u,v] of edges){adj[u].add(v);adj[v].add(u)}
 const code=[];
 const work={};
 verts.forEach(v=>work[v]=new Set(adj[v]));
 while(Object.keys(work).length>2){
  const leaves=Object.keys(work).filter(v=>work[v].size===1).sort();
  if(!leaves.length)break;
  const leaf=leaves[0];
  const neighbor=[...work[leaf]][0];
  code.push(neighbor);
  work[neighbor].delete(leaf);
  delete work[leaf];
 }
 const pos=circleLayout(verts);
 return {
  encoded:`Tree: ${verts.length} vertices, ${edges.length} edges\nPrüfer code (length ${code.length}): ${code.join(' ')}\n\nCayley's formula for ${verts.length} labeled trees: ${verts.length}^(${verts.length}-2) = ${Math.pow(verts.length,verts.length-2)}`,
  html:graphSVG(pos,edges.map(e=>[e[0],e[1]])),
  decoded:`A Prüfer code uniquely represents a labeled tree. The code has length n-2. This gives a bijection with sequences of length n-2 over the vertex set, proving Cayley's formula n^(n-2).`
 };
}
function demoWl(text){
 const {adj}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 let color={};verts.forEach(v=>color[v]=0);
 const rounds=[];
 for(let r=0;r<4;r++){
  const sig={};
  for(const v of verts){
   const neighborColors=(adj[v]||[]).map(([u])=>color[u]).sort().join(',');
   sig[v]=color[v]+'|'+neighborColors;
  }
  const uniq={};let next=0;
  for(const s of [...new Set(Object.values(sig))].sort())uniq[s]=next++;
  const newColor={};
  verts.forEach(v=>newColor[v]=uniq[sig[v]]);
  rounds.push(verts.map(v=>`  ${v}: ${newColor[v]}`).join('\n'));
  color=newColor;
 }
 const pos=circleLayout(verts);
 return {
  encoded:`WL colouring per round:\n\n${rounds.map((r,i)=>`Round ${i+1}:\n${r}`).join('\n\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`The Weisfeiler-Leman test iteratively colours vertices by their neighbourhood colour multiset. If two graphs end up with different colour partitions, they are not isomorphic. Matching colourings do not prove isomorphism.`
 };
}
function demoSpectral(text){
 const {adj}=parseGraph(text,false);
 const verts=Object.keys(adj).filter(v=>v!=='_h');
 const n=verts.length;const idx=Object.fromEntries(verts.map((v,i)=>[v,i]));
 const A=Array.from({length:n},()=>new Array(n).fill(0));
 for(const u of verts)for(const[v] of adj[u]||[])A[idx[u]][idx[v]]=1;
 // Jacobi eigensolver for the Laplacian
 const L=Array.from({length:n},(_,i)=>A[i].map((v,j)=>i===j?A[i].reduce((s,x)=>s+x,0)-v:-v));
 let M=L.map(r=>r.slice());
 let V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
 for(let sweep=0;sweep<50;sweep++){
  let off=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=M[i][j]*M[i][j];
  if(Math.sqrt(2*off)<1e-9)break;
  for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
   if(Math.abs(M[p][q])<1e-12)continue;
   const theta=(M[q][q]-M[p][p])/(2*M[p][q]);
   const t=Math.sign(theta||1)/(Math.abs(theta)+Math.sqrt(theta*theta+1));
   const c=1/Math.sqrt(t*t+1),s=t*c;
   for(let i=0;i<n;i++){const aip=M[i][p],aiq=M[i][q];M[i][p]=c*aip-s*aiq;M[i][q]=s*aip+c*aiq}
   for(let i=0;i<n;i++){const api=M[p][i],aqi=M[q][i];M[p][i]=c*api-s*aqi;M[q][i]=s*api+c*aqi}
   for(let i=0;i<n;i++){const vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-s*viq;V[i][q]=s*vip+c*viq}
  }
 }
 const evals=V[0].map((_,i)=>M[i][i]);
 const order=evals.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
 const fiedlerVec=order[1][1];
 const sorted=verts.map((v,i)=>[v,V[i][fiedlerVec]]).sort((a,b)=>a[1]-b[1]);
 const pos=circleLayout(verts);
 return {
  encoded:`Laplacian eigenvalues: ${order.map(([v])=>v.toFixed(3)).join(', ')}\n\nFiedler vector (sorted):\n${sorted.map(([v,x])=>`  ${v}: ${x.toFixed(4)}`).join('\n')}`,
  html:graphSVG(pos,verts.flatMap(u=>(adj[u]||[]).map(([v])=>[u,v]))),
  decoded:`The second smallest eigenvector of the Laplacian is the Fiedler vector. Vertices with similar values in this vector tend to belong to the same cluster. Cutting the vertex list at the best split point gives a natural bipartition.`
 };
}
function demoTsp(text){
 const {edges}=parseGraph(text,false);
 const verts=[...new Set(edges.flatMap(e=>[e[0],e[1]]))].sort();
 const n=verts.length;
 const dist=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?0:Infinity));
 for(const[u,v,w] of edges){dist[verts.indexOf(u)][verts.indexOf(v)]=w;dist[verts.indexOf(v)][verts.indexOf(u)]=w}
 // nearest neighbour from 0
 const visited=new Set([0]);let cur=0;const tour=[0];let total=0;
 while(visited.size<n){
  let best=-1,bw=Infinity;
  for(let j=0;j<n;j++)if(!visited.has(j)&&dist[cur][j]<bw){bw=dist[cur][j];best=j}
  if(best<0)break;
  tour.push(best);visited.add(best);total+=bw;cur=best;
 }
 total+=dist[cur][0];
 // 2-opt
 let improved=true;
 while(improved){
  improved=false;
  for(let i=1;i<n-1;i++)for(let j=i+1;j<n;j++){
   const a=tour[i-1],b=tour[i],c=tour[j],d=tour[(j+1)%n];
   if(dist[a][b]+dist[c][d]>dist[a][c]+dist[b][d]){
    tour.splice(i,j-i+1,...tour.slice(i,j+1).reverse());
    improved=true;
   }
  }
 }
 let total2=0;
 for(let i=0;i<n;i++)total2+=dist[tour[i]][tour[(i+1)%n]];
 const pos=circleLayout(verts);
 const path=[];
 for(let i=0;i<n;i++)path.push([verts[tour[i]],verts[tour[(i+1)%n]]]);
 return {
  encoded:`Vertices: ${verts.join(', ')}\n\nNearest neighbour tour: ${tour.map(i=>verts[i]).join(' → ')}\nNearest neighbour cost: ${total}\n\nAfter 2-opt: ${tour.map(i=>verts[i]).join(' → ')}\n2-opt cost: ${total2}`,
  html:graphSVG(pos,path,{highlight:new Set(path.map(([u,v])=>u+'-'+v).concat(path.map(([u,v])=>v+'-'+u)))}),
  decoded:`Nearest neighbour is a fast greedy heuristic. 2-opt removes two edges and reconnects, accepting only if the tour shortens. Both are simple and work well on metric TSP.`
 };
}

<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on graph size and density. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Space','Interpretation'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real graph code should use a vetted library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the graph, constraints and the guarantee you need</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use NetworkX, igraph, Boost Graph Library, LEMON, METIS or another vetted library.</p></div></section>
<footer class="footer"><span>Az Graph Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · ENGINEERING TOOLBOOK</div><h1>Understand graph algorithms from BFS to graph neural networks.</h1><p>A beginner friendly course covering graph foundations, ordering, shortest paths, spanning trees, network flow, cuts, routing, tree decompositions, isomorphism, partitioning, and graph layout and learning. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production graph libraries are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Graph viewer, BFS and DFS, connected components and bipartite check, topological sort, cycle detection, SCC (Tarjan), Dijkstra, Bellman-Ford, Floyd-Warshall, Kruskal MST, union-find, bridges, Edmonds-Karp max flow, Hierholzer Euler path, binary lifting LCA, k-core, Prüfer codes, Weisfeiler-Leman, spectral partitioning, Fruchterman-Reingold layout, nearest neighbour and 2-opt TSP.</p></div><div class="mini"><h3>What does not run here</h3><p>Production implementations of Dinic, push-relabel, Boykov-Kolmogorov, Hopcroft-Karp, Stoer-Wagner, Gomory-Hu, Yen k-shortest, delta-stepping, Christofides, Lin-Kernighan, HLD, centroid decomposition, nauty, planarity testing, dominator trees, METIS, Leiden, Infomap, VF2, Sugiyama, Kamada-Kawai, GCN, GAT and GraphSAGE. For real work use NetworkX, igraph, Boost Graph Library, LEMON, METIS, PyTorch Geometric or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from foundations to graph learning.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az Graph Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('graph-representations');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'graph-representations');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Graph Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-graph-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
