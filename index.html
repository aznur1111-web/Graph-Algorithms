 mentalText:"BFS spreads out evenly, level by level. DFS goes deep first and backtracks when stuck.",
 steps:["BFS: mark the start, push it to a queue.","BFS: while the queue is not empty, pop a vertex and enqueue its unvisited neighbours.","DFS: mark the start, push to a stack (or recurse).","DFS: dive into each neighbour, backtrack when the deepest vertex is exhausted."],
 pseudo:"BFS(s):\n  visited = {}\n  queue = [s]\n  visited[s] = true\n  while queue:\n    u = queue.pop(0)\n    for v in neighbors(u):\n      if not visited[v]:\n        visited[v] = true\n        queue.append(v)\n\nDFS(s):\n  visited = {}\n  stack = [s]\n  while stack:\n    u = stack.pop()\n    if visited[u]: continue\n    visited[u] = true\n    for v in neighbors(u):\n      if not visited[v]: stack.append(v)\n\nBoth: O(V + E) time, O(V) space.",
 uses:"Reachability, shortest paths (unweighted), connected components, cycle detection, topological sort, web crawling.",
 strength:"Simple, fast and the base of many other algorithms.",
 limits:"Both visit each edge once. Do not give edge weights meaning.",
 pitfall:"Recursive DFS can overflow the stack for deep graphs. Use an explicit stack for large graphs.",
 question:"Which algorithm finds shortest paths in an unweighted graph?",
 answer:"BFS. It visits vertices in order of distance from the start, so the first time a vertex is reached its distance is minimal.",
 demo:"bfs-dfs",sample:"start A\nA B\nA C\nB D\nC D\nD E\nE F",refs:[
  ["CLRS, Chapter 20 Elementary Graph Algorithms","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Tarjan, Depth-first search and linear graph algorithms, SIAM J. Comput. 1972","https://doi.org/10.1137/0201010"],
  ["Moore, The shortest path through a maze, 1959","https://archive.org/details/proceedingsofint1959harv"]]},
{id:"connected-bipartite",title:"Connected components and bipartite checks",level:2,kind:"Structural property",status:"Runnable teaching lab",
 summary:"Connected components partition an undirected graph into groups where every vertex can reach every other. A bipartite graph can be 2-coloured so no edge connects vertices of the same colour.",
 mental:"Islands in an archipelago and a two-colour painting game",
 mentalText:"Every island is a component. For bipartiteness, colour vertices with two colours and check that every edge connects opposite colours.",
 steps:["For components: run BFS or DFS from every unvisited vertex.","Each traversal finds one component.","For bipartite: run BFS and 2-colour.","If an edge connects same-coloured vertices, the graph is not bipartite."],
 pseudo:"Connected components:\n  comp_id = {}\n  c = 0\n  for v in vertices:\n    if v not in comp_id:\n      BFS(v, mark comp_id=c)\n      c += 1\n\nBipartite check:\n  color = {}\n  for v in vertices:\n    if v not in color:\n      color[v] = 0\n      BFS: for each edge (u, w):\n        if w not in color: color[w] = 1 - color[u]\n        elif color[w] == color[u]: return NOT BIPARTITE\n  return BIPARTITE",
 uses:"Image segmentation, social network clusters, scheduling with two resource types, cycle detection in odd-length cycles.",
 strength:"Linear time. Bipartite detection is the same cost as BFS.",
 limits:"Only undirected graphs for components. Directed connectivity uses SCCs instead.",
 pitfall:"A graph with any odd-length cycle is not bipartite. Even-length cycles are fine.",
 question:"Is a triangle (3-cycle) bipartite?",
 answer:"No. A triangle has an odd cycle length. You cannot 2-colour three mutually adjacent vertices.",
 demo:"components",sample:"A B\nB C\nC A\nD E\nE F",refs:[
  ["Hopcroft and Tarjan, Algorithm 447: Efficient algorithms for graph manipulation, CACM 1973","https://doi.org/10.1145/362248.362272"],
  ["König, Graphen und Matrizen, Mat. Fiz. Lapok 1931","https://en.wikipedia.org/wiki/Bipartite_graph"],
  ["Wikipedia, Bipartite graph","https://en.wikipedia.org/wiki/Bipartite_graph"]]},

{id:"topological-sort",title:"Topological sort and Kahn's algorithm",level:3,kind:"Ordering",status:"Runnable teaching lab",
 summary:"A topological sort orders the vertices of a directed acyclic graph so that every edge goes from earlier to later. Kahn's algorithm uses in-degree counting.",
 mental:"Putting on clothes in an order that respects dependencies",
 mentalText:"Socks before shoes, shirt before jacket. Topological sort finds a valid order for any set of dependencies.",
 steps:["Compute in-degree of each vertex.","Put vertices with in-degree 0 in a queue.","Pop a vertex, add it to the order, decrement neighbours' in-degrees.","If a neighbour reaches in-degree 0, push it.","If the order has fewer than V vertices, the graph has a cycle."],
 pseudo:"Kahn(G):\n  indeg = {v: 0 for v in V}\n  for (u, v) in E: indeg[v] += 1\n\n  queue = [v for v in V if indeg[v] == 0]\n  order = []\n\n  while queue:\n    u = queue.pop()\n    order.append(u)\n    for w in neighbors(u):\n      indeg[w] -= 1\n      if indeg[w] == 0: queue.append(w)\n\n  if len(order) != |V|: report CYCLE\n  return order\n\nTime: O(V + E)",
 uses:"Build systems, package managers, task scheduling, course prerequisite ordering, spreadsheet recalculation.",
 strength:"Simple and linear time.",
 limits:"Only for DAGs. Multiple valid orders exist; picking one is arbitrary.",
 pitfall:"A graph with a cycle has no topological order. Kahn's algorithm detects this by producing fewer than V vertices.",
 question:"Can a graph with a cycle have a topological order?",
 answer:"No. If A depends on B and B depends on A, there is no valid ordering. The cycle has no first vertex.",
 demo:"topo-sort",sample:"shirt tie\nshirt belt\ntie jacket\nbelt jacket\npants belt\npants shoes\nsocks shoes",refs:[
  ["Kahn, Topological sorting of large networks, CACM 1962","https://doi.org/10.1145/368996.369025"],
  ["CLRS, Section 20.4 Topological sort","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Topological sorting","https://en.wikipedia.org/wiki/Topological_sorting"]]},
{id:"cycle-detection",title:"Cycle detection",level:3,kind:"Structural property",status:"Runnable teaching lab",
 summary:"Directed cycle detection uses DFS with three colours (white, grey, black). An edge to a grey vertex is a back edge and reveals a cycle.",
 mental:"Walking a maze and finding your own footsteps",
 mentalText:"If you reach a vertex you are currently exploring, you have walked in a circle. That is a cycle.",
 steps:["Mark all vertices white (unvisited).","DFS: mark a vertex grey when entering it.","If you see an edge to a grey vertex, there is a cycle.","Mark the vertex black when its DFS finishes."],
 pseudo:"has_cycle(G):\n  color = {v: WHITE for v in V}\n  def dfs(u):\n    color[u] = GREY\n    for v in neighbors(u):\n      if color[v] == GREY: return True\n      if color[v] == WHITE and dfs(v): return True\n    color[u] = BLACK\n    return False\n  for v in V:\n    if color[v] == WHITE and dfs(v): return True\n  return False\n\nTime: O(V + E)",
 uses:"Deadlock detection, dependency validation, cyclic circuit detection, parser error reporting.",
 strength:"Linear time. Works on directed and undirected graphs.",
 limits:"Undirected needs a parent check to avoid reporting the back edge to the parent as a cycle.",
 pitfall:"For undirected graphs you must skip the parent edge. Otherwise every edge looks like a cycle.",
 question:"Why does the three-colour method work?",
 answer:"A grey vertex is on the current DFS path. An edge to a grey vertex means the path has returned to itself, which is exactly a cycle.",
 demo:"cycle-detect",sample:"A B\nB C\nC D\nD B\nE A",refs:[
  ["CLRS, Section 20.3 Depth-first search and cycle detection","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Tarjan, Depth-first search and linear graph algorithms, SIAM J. Comput. 1972","https://doi.org/10.1137/0201010"],
  ["Wikipedia, Cycle detection","https://en.wikipedia.org/wiki/Cycle_detection"]]},
{id:"scc",title:"Strongly connected components",level:4,kind:"Structural decomposition",status:"Runnable teaching lab",
 summary:"An SCC is a maximal set of vertices where every vertex can reach every other. Tarjan's algorithm finds all SCCs in a single DFS pass in O(V + E).",
 mental:"Groups of vertices that can all reach each other",
 mentalText:"In a directed graph, some vertices can reach each other in both directions. Those groups are SCCs.",
 steps:["Run DFS, tracking discovery time and low-link values.","Push vertices on a stack as they are visited.","On backtracking, update low-link with the minimum of children's low-links.","When low-link equals discovery time, pop the stack to form one SCC."],
 pseudo:"Tarjan(G):\n  index = 0\n  indices, lowlink = {}, {}\n  stack, on_stack = [], set()\n  sccs = []\n\n  def strongconnect(v):\n    indices[v] = lowlink[v] = index++; index += 1\n    stack.append(v); on_stack.add(v)\n    for w in neighbors(v):\n      if w not in indices:\n        strongconnect(w)\n        lowlink[v] = min(lowlink[v], lowlink[w])\n      elif w in on_stack:\n        lowlink[v] = min(lowlink[v], indices[w])\n    if lowlink[v] == indices[v]:\n      scc = []\n      while True:\n        w = stack.pop(); on_stack.remove(w)\n        scc.append(w)\n        if w == v: break\n      sccs.append(scc)\n\n  for v in V:\n    if v not in indices: strongconnect(v)\n  return sccs",
 uses:"Compiler optimization, dead code elimination, 2-SAT solving, social network clustering, dependency analysis.",
 strength:"Linear time. One DFS pass is enough.",
 limits:"Recursive implementation may overflow for deep graphs.",
 pitfall:"The key invariant is that low-link equals index exactly at the root of each SCC.",
 question:"How many SCCs does a directed acyclic graph have?",
 answer:"V. Every vertex is its own SCC because no cycle exists.",
 demo:"scc",sample:"A B\nB C\nC A\nC D\nD E\nE D\nE F",refs:[
  ["Tarjan, Depth-first search and linear graph algorithms, SIAM J. Comput. 1972","https://doi.org/10.1137/0201010"],
  ["Kosaraju, unpublished, cited in Aho, Hopcroft, Ullman","https://en.wikipedia.org/wiki/Kosaraju%27s_algorithm"],
  ["CLRS, Section 20.5 Strongly connected components","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},

{id:"bfs-shortest",title:"BFS shortest paths",level:2,kind:"Shortest path",status:"Runnable teaching lab",
 summary:"In an unweighted graph, BFS finds the shortest path from a start vertex to every other vertex. The number of edges in the path is the distance.",
 mental:"Counting hops between friends",
 mentalText:"You want the minimum number of friends between you and someone else. BFS finds it by exploring layer by layer.",
 steps:["Start BFS from the source.","Track distance for each visited vertex.","Neighbours of a distance-k vertex have distance k+1.","Stop when the queue is empty or all targets are found."],
 pseudo:"bfs_shortest(G, s):\n  dist = {v: infinity for v in V}\n  parent = {v: None for v in V}\n  dist[s] = 0\n  queue = [s]\n  while queue:\n    u = queue.pop(0)\n    for v in neighbors(u):\n      if dist[v] == infinity:\n        dist[v] = dist[u] + 1\n        parent[v] = u\n        queue.append(v)\n  return dist, parent\n\nTime: O(V + E)",
 uses:"Social network distance, maze solving, unweighted route planning, word ladder puzzles.",
 strength:"Linear time. Simple.",
 limits:"Only for unweighted graphs. Use Dijkstra for weights.",
 pitfall:"BFS distances are in edges, not in weight. If weights matter, use Dijkstra.",
 question:"What is the shortest path from A to D in a graph A-B-C-D where A also connects to D?",
 answer:"One edge (A-D) beats three edges (A-B-C-D). BFS finds the minimum edge count.",
 demo:"bfs-path",sample:"start A\ntarget F\nA B\nA C\nB D\nC D\nD E\nE F",refs:[
  ["CLRS, Section 20.2 Breadth-first search","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Sedgewick and Wayne, Algorithms, Section 4.1","https://algs4.cs.princeton.edu/home/"],
  ["Wikipedia, Breadth-first search","https://en.wikipedia.org/wiki/Breadth-first_search"]]},
{id:"dijkstra",title:"Dijkstra's shortest path",level:3,kind:"Shortest path",status:"Runnable teaching lab",
 summary:"Dijkstra finds shortest paths from one source to all vertices with non-negative edge weights. It repeatedly extracts the unvisited vertex with the smallest tentative distance.",
 mental:"Water spreading through pipes with different resistance",
 mentalText:"Water reaches the closest vertex first. Each vertex's distance is the total cost of the cheapest path so far.",
 steps:["Set distance to source as 0 and all others to infinity.","Use a priority queue ordered by distance.","Pop the vertex with minimum distance.","Relax each edge: if a shorter path is found, update and push."],
 pseudo:"dijkstra(G, s):\n  dist = {v: infinity for v in V}\n  dist[s] = 0\n  pq = [(0, s)]\n  while pq:\n    d, u = pq.pop_min()\n    if d > dist[u]: continue\n    for v, w in neighbors(u):\n      nd = dist[u] + w\n      if nd < dist[v]:\n        dist[v] = nd\n        pq.push((nd, v))\n  return dist\n\nBinary heap: O((V + E) log V)\nFibonacci heap: O(E + V log V)",
 invariant:"When a vertex is popped, its distance is final. This requires non-negative weights.",
 uses:"Route planning, network routing (OSPF), map navigation, resource allocation.",
 strength:"Fast for non-negative weights. The standard algorithm for road networks.",
 limits:"Fails on negative edges. Uses more memory than BFS for large graphs.",
 pitfall:"Dijkstra on a graph with a negative edge gives wrong answers. Use Bellman-Ford instead.",
 question:"Why does Dijkstra fail on negative edges?",
 answer:"Once a vertex is popped, Dijkstra assumes its distance is final. A negative edge discovered later could reduce it, breaking the invariant.",
 demo:"dijkstra",sample:"source A\nA B 4\nA C 2\nC B 1\nB D 5\nC D 8\nD E 2\nC E 10",refs:[
  ["Dijkstra, A note on two problems in connexion with graphs, Numerische Mathematik 1959","https://doi.org/10.1007/BF01386390"],
  ["CLRS, Section 22.3 Dijkstra's algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Dijkstra's algorithm","https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm"]]},
{id:"bellman-ford",title:"Bellman-Ford",level:3,kind:"Shortest path",status:"Runnable teaching lab",
 summary:"Bellman-Ford finds shortest paths even with negative edges. It relaxes every edge V-1 times, then checks for negative cycles.",
 mental:"Repeatedly relaxing edges until no more improvement is possible",
 mentalText:"Each pass improves distances by at least one edge. After V-1 passes every shortest path has been found.",
 steps:["Set distance to source as 0 and all others to infinity.","Repeat V-1 times: relax every edge.","Relaxation: if dist[u] + w < dist[v], update dist[v].","Do one more pass. If any update is possible, there is a negative cycle."],
 pseudo:"bellman_ford(G, s):\n  dist = {v: infinity for v in V}\n  dist[s] = 0\n  for _ in range(V - 1):\n    for (u, v, w) in E:\n      if dist[u] + w < dist[v]:\n        dist[v] = dist[u] + w\n  for (u, v, w) in E:\n    if dist[u] + w < dist[v]:\n      report NEGATIVE CYCLE\n  return dist\n\nTime: O(V * E)",
 uses:"Routing protocols (RIP), currency arbitrage detection, distance-vector routing, graphs with negative weights.",
 strength:"Handles negative edges. Detects negative cycles.",
 limits:"Slower than Dijkstra: O(V·E) instead of O((V+E) log V).",
 pitfall:"Bellman-Ford reports shortest paths only if no negative cycle is reachable from the source. A negative cycle makes distances undefined.",
 question:"What happens if a graph has a negative cycle reachable from the source?",
 answer:"Distances keep decreasing. There is no shortest path. Bellman-Ford reports the negative cycle.",
 demo:"bellman-ford",sample:"source A\nA B 4\nA C 5\nB C -3\nC D 2\nD B 1",refs:[
  ["Bellman, On a routing problem, Quarterly of Applied Mathematics 1958","https://doi.org/10.1090/qam/102435"],
  ["Ford and Fulkerson, Flows in Networks, Princeton 1962","https://press.princeton.edu/books/paperback/9780691625397/flows-in-networks"],
  ["CLRS, Section 22.1 The Bellman-Ford algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
/* Chapter 4 */
{id:"floyd-warshall",title:"Floyd-Warshall all-pairs shortest paths",level:4,kind:"Shortest path",status:"Runnable teaching lab",
 summary:"Floyd-Warshall computes shortest paths between every pair of vertices in O(V³) time. It uses dynamic programming over intermediate vertices.",
 mental:"Can I get from i to j by going through k?",
 mentalText:"For each pair (i, j), check if routing through an intermediate vertex k gives a shorter path. Repeat for every k.",
 steps:["Initialize the distance matrix with direct edge weights.","For each intermediate vertex k:","For each pair (i, j): update D[i][j] = min(D[i][j], D[i][k] + D[k][j]).","Return the final distance matrix."],
 pseudo:"floyd_warshall(G):\n  n = |V|\n  D = [[inf for j in range(n)] for i in range(n)]\n  for i in range(n): D[i][i] = 0\n  for (u, v, w) in E: D[u][v] = w\n\n  for k in range(n):\n    for i in range(n):\n      for j in range(n):\n        if D[i][k] + D[k][j] < D[i][j]:\n          D[i][j] = D[i][k] + D[k][j]\n\n  return D\n\nTime: O(V^3)\nSpace: O(V^2)\n\nWorks with negative edges.\nNegative cycle: D[i][i] < 0 for some i.",
 uses:"All-pairs queries, network diameter, transitive closure (with boolean OR and AND), arbitrage detection.",
 strength:"Very simple. Works for dense graphs. Handles negative edges.",
 limits:"O(V³) is prohibitive for large graphs. For sparse graphs run Dijkstra from each vertex.",
 pitfall:"The order of loops matters: k must be the outermost loop. Swapping k and i gives wrong answers.",
 question:"How do you detect a negative cycle with Floyd-Warshall?",
 answer:"After running the algorithm, check if any diagonal entry D[i][i] is negative. If so, a negative cycle exists.",
 demo:"floyd",sample:"A B 3\nA C 8\nB C 2\nB D 5\nC D 1\nD A 2",refs:[
  ["Floyd, Algorithm 97: Shortest path, CACM 1962","https://doi.org/10.1145/367766.368168"],
  ["Warshall, A theorem on boolean matrices, JACM 1962","https://doi.org/10.1145/321105.321107"],
  ["CLRS, Section 23.2 The Floyd-Warshall algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
{id:"johnson",title:"Johnson's algorithm",level:5,kind:"Shortest path",status:"Concept lesson",
 summary:"Johnson re-weights edges to make them non-negative, then runs Dijkstra from each vertex. It is faster than Floyd-Warshall on sparse graphs with negative edges.",
 mental:"Shift edge weights to remove negatives, then reuse Dijkstra",
 mentalText:"Add a dummy vertex, run Bellman-Ford to get potentials, then re-weight edges so all weights are non-negative. Run Dijkstra from every vertex.",
 steps:["Add a dummy vertex s connected to all vertices with weight 0.","Run Bellman-Ford from s to get potential h[v].","Re-weight each edge (u, v, w) to w + h[u] - h[v].","Run Dijkstra from each vertex on the re-weighted graph.","Adjust distances back to the original weights."],
 pseudo:"johnson(G):\n  add vertex s with edges (s, v, 0) for all v\n  h = bellman_ford(G, s)\n  if negative cycle: abort\n\n  for (u, v, w) in E:\n    w' = w + h[u] - h[v]\n\n  for u in V:\n    dist_u = dijkstra(re-weighted G, u)\n    for v in V:\n      D[u][v] = dist_u[v] - h[u] + h[v]\n\n  return D\n\nTime: O(V * E + V * (V + E) log V)\nOn sparse graphs, faster than Floyd-Warshall.",
 uses:"Sparse graphs with negative edges, all-pairs queries on large networks.",
 strength:"Asymptotically faster than Floyd-Warshall on sparse graphs.",
 limits:"Requires Bellman-Ford once. More complex to implement.",
 pitfall:"Re-weighting is exact: shortest paths are preserved in the original graph. Do not forget the +h[u] and -h[v] correction.",
 question:"Why does Johnson's re-weighting preserve shortest paths?",
 answer:"The re-weighted distance equals the original distance plus h[source] minus h[target]. This term is the same for all paths between two vertices, so the shortest path is unchanged.",
 demo:"none",sample:"",refs:[
  ["Johnson, Efficient algorithms for shortest paths in sparse networks, JACM 1977","https://doi.org/10.1145/321992.321993"],
  ["CLRS, Section 23.3 Johnson's algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Johnson's algorithm","https://en.wikipedia.org/wiki/Johnson%27s_algorithm"]]},
{id:"a-star",title:"A* search",level:4,kind:"Heuristic shortest path",status:"Runnable teaching lab",
 summary:"A* is Dijkstra plus a heuristic that estimates distance to the goal. With an admissible heuristic it finds the optimal path while exploring fewer vertices.",
 mental:"Dijkstra that looks toward the goal",
 mentalText:"Instead of expanding in all directions, A* uses a heuristic to prefer vertices that seem closer to the goal.",
 steps:["Maintain a priority queue ordered by f(n) = g(n) + h(n).","g(n) is the known cost from start to n.","h(n) is the heuristic estimate from n to goal.","Pop the vertex with smallest f, relax its edges.","Stop when the goal is popped."],
 pseudo:"a_star(G, s, t, h):\n  g = {v: infinity for v in V}\n  g[s] = 0\n  pq = [(h(s), s)]\n  closed = set()\n\n  while pq:\n    f, u = pq.pop_min()\n    if u == t: return g[t]\n    if u in closed: continue\n    closed.add(u)\n    for v, w in neighbors(u):\n      ng = g[u] + w\n      if ng < g[v]:\n        g[v] = ng\n        pq.push((ng + h(v), v))\n\nAdmissible h: never overestimates true distance.\nConsistent h: h(u) <= w(u, v) + h(v).\nWith consistent h, A* is optimal and each vertex is popped once.",
 uses:"Map navigation, robotics, game AI pathfinding, puzzle solving.",
 strength:"Faster than Dijkstra when a good heuristic is available.",
 limits:"Bad heuristics give wrong answers or no speedup. Requires non-negative weights.",
 pitfall:"An inadmissible heuristic (overestimating) makes A* return suboptimal paths.",
 question:"What is an admissible heuristic?",
 answer:"One that never overestimates the true remaining distance. Euclidean distance in 2D space is admissible for grid navigation because straight-line distance is the shortest possible.",
 demo:"a-star",sample:"source A\ntarget F\nhA 6\nhB 4\nhC 4\nhD 2\nhE 1\nhF 0\nA B 2\nA C 3\nB D 4\nC D 1\nD E 2\nE F 1",refs:[
  ["Hart, Nilsson, Raphael, A formal basis for the heuristic determination of minimum cost paths, IEEE Trans. SSC 1968","https://doi.org/10.1109/TSSC.1968.300136"],
  ["Russell and Norvig, Artificial Intelligence: A Modern Approach, Chapter 3","https://aima.cs.berkeley.edu/"],
  ["Wikipedia, A* search algorithm","https://en.wikipedia.org/wiki/A*_search_algorithm"]]},
{id:"yen-k-shortest",title:"Yen's k-shortest paths",level:5,kind:"Shortest path",status:"Concept lesson",
 summary:"Yen's algorithm finds the k shortest loopless paths between two vertices. It repeatedly runs Dijkstra on a modified graph that bans parts of previously found paths.",
 mental:"Find the shortest path, then the next shortest that is not the same",
 mentalText:"To find the second shortest, block one edge of the first path and ask Dijkstra for a new path. Combine results and pick the best.",
 steps:["Run Dijkstra to get the shortest path P0.","Add P0 to the result list A.","For each vertex in the previous path, block the last edge and find a new Dijkstra path.","Collect candidates in a priority queue B.","Pop the best candidate, add to A, and repeat."],
 pseudo:"yen(G, s, t, k):\n  A = [dijkstra(G, s, t)]\n  B = min-heap\n\n  for i in range(1, k):\n    prev = A[i - 1]\n    for j in range(len(prev) - 1):\n      root_path = prev[:j + 1]\n      root_cost = cost(root_path)\n      banned_edges = []\n      for p in A:\n        if p[:j + 1] == root_path and len(p) > j + 1:\n          banned_edges.append((p[j], p[j + 1]))\n\n      spur_path = dijkstra(G - banned_edges, prev[j], t)\n      if spur_path:\n        total = root_path[:-1] + spur_path\n        B.push(total)\n\n    if B empty: break\n    A.append(B.pop_min())\n\n  return A",
 uses:"Route alternatives in navigation, network resilience, logistics with backup plans.",
 strength:"Finds k distinct paths. Each is optimal given the previous ones.",
 limits:"Slower than a single Dijkstra: O(k · V · (E + V log V)).",
 pitfall:"Loopless paths are required. Cycles must be forbidden, otherwise k-shortest is trivial and infinite.",
 question:"Why does Yen's algorithm need to ban edges?",
 answer:"To force the next Dijkstra to find a different path. Without banning, Dijkstra returns the same shortest path again.",
 demo:"none",sample:"",refs:[
  ["Yen, Finding the K shortest loopless paths in a network, Management Science 1971","https://doi.org/10.1287/mnsc.17.11.712"],
  ["Eppstein, Finding the k shortest paths, SIAM J. Comput. 1998","https://doi.org/10.1137/S0097539795290477"],
  ["Wikipedia, Yen's algorithm","https://en.wikipedia.org/wiki/Yen%27s_algorithm"]]},
{id:"delta-stepping",title:"Delta-stepping and bidirectional search",level:5,kind:"Parallel shortest path",status:"Concept lesson",
 summary:"Delta-stepping parallelizes Dijkstra by grouping vertices into buckets by distance range. Bidirectional search runs two Dijkstra searches from source and target that meet in the middle.",
 mental:"Widening buckets and two searches that meet",
 mentalText:"Delta-stepping uses buckets of width delta. All vertices in the same bucket are relaxed in parallel. Bidirectional search cuts the explored space in half.",
 steps:["Delta-stepping: bucket vertices by floor(dist/delta).","Process buckets in order.","Within a bucket, relax all light edges in parallel.","Then relax heavy edges to later buckets.","Bidirectional: run Dijkstra from both ends.","Alternate advancing the smaller frontier.","Stop when frontiers meet."],
 pseudo:"delta_stepping(G, s, delta):\n  buckets = defaultdict(list)\n  buckets[0].append(s)\n  dist[s] = 0\n  while any bucket is non-empty:\n    i = smallest non-empty bucket\n    R = set()\n    while buckets[i]:\n      for u in buckets[i]:\n        for (v, w) in light_edges(u):    # w <= delta\n          nd = dist[u] + w\n          if nd < dist[v]:\n            old_bucket = floor(dist[v] / delta)\n            dist[v] = nd\n            new_bucket = floor(nd / delta)\n            move v from old to new bucket\n            R.add(v)\n      buckets[i] = []\n    for u in R:\n      for (v, w) in heavy_edges(u):       # w > delta\n        nd = dist[u] + w\n        if nd < dist[v]:\n          dist[v] = nd\n          buckets[floor(nd / delta)].append(v)",
 uses:"Parallel and distributed shortest paths, road networks, GPU routing.",
 strength:"Delta-stepping parallelizes well. Bidirectional halves the explored space for point-to-point queries.",
 limits:"Choosing delta is tricky. Bidirectional needs a consistent stopping rule.",
 pitfall:"Bidirectional Dijkstra must terminate when the sum of the two frontiers exceeds the best known path.",
 question:"What is the main advantage of bidirectional Dijkstra?",
 answer:"It explores two half-radii instead of one full radius. For a roughly uniform graph, this cuts the explored area by a factor of about 4.",
 demo:"none",sample:"",refs:[
  ["Meyer and Sanders, Delta-stepping: A parallelizable shortest path algorithm, J. Algorithms 2003","https://doi.org/10.1016/S0196-6774(03)00076-2"],
  ["Pohl, Bi-directional search, in Machine Intelligence 6, 1971","https://www.sciencedirect.com/book/9780444195746/machine-intelligence-6"],
  ["Wikipedia, Bidirectional search","https://en.wikipedia.org/wiki/Bidirectional_search"]]},

{id:"mst",title:"Minimum spanning tree: Prim, Kruskal and Boruvka",level:3,kind:"Spanning tree",status:"Runnable teaching lab",
 summary:"An MST connects all vertices with minimum total edge weight. Prim grows from a seed. Kruskal sorts edges and unions. Boruvka merges cheapest edges in rounds.",
 mental:"Connecting cities with the cheapest roads",
 mentalText:"You want to link every city to the network with the least total road length. Any spanning tree does that; the MST does it cheapest.",
 steps:["Prim: start from any vertex, repeatedly add the cheapest edge to the tree.","Kruskal: sort edges by weight, add each edge if it does not create a cycle.","Boruvka: for each component, add the cheapest edge leaving it.","Repeat until one component remains."],
 pseudo:"Kruskal:\n  sort edges by weight\n  uf = UnionFind(V)\n  mst = []\n  for (u, v, w) in sorted_edges:\n    if uf.find(u) != uf.find(v):\n      uf.union(u, v)\n      mst.append((u, v, w))\n  return mst\n\nPrim (binary heap):\n  visited = {}\n  pq = [(0, start, None)]\n  while pq:\n    w, u, parent = pq.pop_min()\n    if u in visited: continue\n    visited.add(u)\n    if parent is not None: mst.append((parent, u, w))\n    for v, w2 in neighbors(u):\n      if v not in visited: pq.push((w2, v, u))\n\nBoruvka:\n  components = each vertex alone\n  while more than one component:\n    find cheapest edge per component\n    add them all (merging components)",
 uses:"Network design, clustering, image segmentation, approximation for Steiner tree and TSP.",
 strength:"O(E log E) with Kruskal. Simple, widely applicable.",
 limits:"Assumes the graph is connected. For disconnected graphs you get a minimum spanning forest.",
 pitfall:"Kruskal must use union-find to detect cycles. Without it, a greedy choice may create a cycle.",
 question:"How many edges does an MST have?",
 answer:"V - 1 for a connected graph with V vertices.",
 demo:"mst",sample:"A B 1\nA C 4\nB C 2\nB D 5\nC D 3\nD E 1\nC E 6",refs:[
  ["Kruskal, On the shortest spanning subtree of a graph, Proc. AMS 1956","https://doi.org/10.1090/S0002-9939-1956-0078686-7"],
  ["Prim, Shortest connection networks and some generalizations, Bell System Tech. J. 1957","https://doi.org/10.1002/j.1538-7305.1957.tb01515.x"],
  ["Boruvka, O jistem problemu minimalnim, Prace Moravske Prirodovedecke Spolecnosti 1926","https://en.wikipedia.org/wiki/Otakar_Bor%C5%AFvka"],
  ["CLRS, Chapter 21 Minimum Spanning Trees","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
{id:"union-find",title:"Union-find (disjoint set union)",level:3,kind:"Data structure",status:"Runnable teaching lab",
 summary:"Union-find tracks which elements are in the same set. Union merges two sets. Find returns the representative. With path compression and union by rank it is nearly O(1) per operation.",
 mental:"A forest where each tree is one set",
 mentalText:"Every element points to a parent. The root of the tree is the representative. Union attaches one root under another. Path compression flattens the tree.",
 steps:["Initialize: each element is its own parent.","Find: follow parent pointers to the root.","Find: path compression makes every node point to the root.","Union: attach the shorter tree under the taller one.","Track sizes or ranks to keep trees shallow."],
 pseudo:"parent = list(range(n))\nrank = [0] * n\n\ndef find(x):\n  if parent[x] != x:\n    parent[x] = find(parent[x])   # path compression\n  return parent[x]\n\ndef union(a, b):\n  ra, rb = find(a), find(b)\n  if ra == rb: return False\n  if rank[ra] < rank[rb]:\n    ra, rb = rb, ra\n  parent[rb] = ra\n  if rank[ra] == rank[rb]:\n    rank[ra] += 1\n  return True\n\nAmortized time per operation: O(alpha(n)) ~= O(1)",
 uses:"Kruskal's MST, image connected components, dynamic connectivity, percolation, union of overlapping intervals.",
 strength:"Nearly O(1) amortized. Very simple.",
 limits:"Cannot split sets. Only merges.",
 pitfall:"Without path compression or union by rank, the tree becomes a chain and operations are O(n).",
 question:"What is the inverse Ackermann function alpha(n)?",
 answer:"A function that grows incredibly slowly. For any practical n, alpha(n) is at most 4 or 5. So union-find is effectively O(1) per operation.",
 demo:"union-find",sample:"union A B\nunion B C\nunion D E\nfind A\nfind C\nfind D\nfind F",refs:[
  ["Tarjan, Efficiency of a good but not linear set union algorithm, JACM 1975","https://doi.org/10.1145/321879.321884"],
  ["Tarjan and van Leeuwen, Worst-case analysis of set union algorithms, JACM 1984","https://doi.org/10.1145/62.2160"],
  ["CLRS, Chapter 19 Data Structures for Disjoint Sets","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
{id:"bridges-articulation",title:"Bridges and articulation points",level:4,kind:"Connectivity",status:"Runnable teaching lab",
 summary:"A bridge is an edge whose removal disconnects the graph. An articulation point is a vertex whose removal disconnects it. Both are found in one DFS pass with low-link values.",
 mental:"The weak links that hold the network together",
 mentalText:"If removing one edge splits the graph, that edge is a bridge. If removing one vertex does, it is an articulation point.",
 steps:["Run DFS, record discovery time and low-link for each vertex.","Low-link is the smallest discovery time reachable via back edges.","An edge (u, v) is a bridge if low[v] > disc[u].","A vertex u is an articulation point if it has a child v with low[v] >= disc[u].","The root is special: it is an articulation point if it has two or more DFS children."],
 pseudo:"find_bridges(G):\n  disc = {}, low = {}, time = 0\n  bridges = []\n\n  def dfs(u, parent):\n    disc[u] = low[u] = time; time += 1\n    for v in neighbors(u):\n      if v == parent: continue\n      if v in disc:\n        low[u] = min(low[u], disc[v])\n      else:\n        dfs(v, u)\n        low[u] = min(low[u], low[v])\n        if low[v] > disc[u]:\n          bridges.append((u, v))\n\n  for v in V:\n    if v not in disc: dfs(v, None)\n  return bridges\n\nTime: O(V + E)",
 uses:"Network reliability, 2-edge-connected components, weak link detection in infrastructure.",
 strength:"Linear time. One DFS pass.",
 limits:"Only for undirected graphs.",
 pitfall:"The parent check must be by edge, not by vertex, in multigraphs.",
 question:"A graph is a tree. How many bridges does it have?",
 answer:"Every edge is a bridge, V-1 total. Removing any edge disconnects the tree.",
 demo:"bridges",sample:"A B\nB C\nC A\nC D\nD E",refs:[
  ["Tarjan, Depth-first search and linear graph algorithms, SIAM J. Comput. 1972","https://doi.org/10.1137/0201010"],
  ["CLRS, problem 20-2 Articulation points, bridges, biconnected components","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Bridge (graph theory)","https://en.wikipedia.org/wiki/Bridge_(graph_theory)"]]},

{id:"max-flow",title:"Ford-Fulkerson and Edmonds-Karp",level:4,kind:"Max flow",status:"Runnable teaching lab",
 summary:"Ford-Fulkerson finds the maximum flow from source to sink by repeatedly finding augmenting paths. Edmonds-Karp uses BFS for shortest augmenting paths.",
 mental:"Water flowing through pipes with capacities",
 mentalText:"Push as much flow as possible along a path. When a pipe is full, reroute using residual edges. Repeat until no more can be pushed.",
 steps:["Build a residual graph where each edge has leftover capacity.","Find a path from source to sink in the residual graph.","Push the minimum capacity along the path.","Update residual capacities (forward decreases, backward increases).","Repeat until no augmenting path exists."],
 pseudo:"ford_fulkerson(G, s, t):\n  flow = 0\n  while True:\n    path = dfs_or_bfs_residual(G, s, t)   # find augmenting path\n    if not path: break\n    bottleneck = min(residual[e] for e in path)\n    for e in path:\n      residual[e] -= bottleneck\n      residual[reverse(e)] += bottleneck\n    flow += bottleneck\n  return flow\n\nEdmonds-Karp: use BFS.\nTime: O(V * E^2)\nFord-Fulkerson with arbitrary DFS: O(E * max_flow), can be exponential.",
 uses:"Bipartite matching, image segmentation, network routing, project selection, scheduling.",
 strength:"Foundation of all max flow algorithms. Simple to understand.",
 limits:"Ford-Fulkerson with DFS can be exponential. Edmonds-Karp is polynomial but slower than Dinic.",
 pitfall:"Augmenting paths can use residual edges (backwards). A path that undoes previous flow is valid.",
 question:"Why do residual edges exist?",
 answer:"They allow the algorithm to reroute flow if a later path can make better use of the capacity. Without them, greedy choices would be final.",
 demo:"max-flow",sample:"source A\nsink D\nA B 3\nA C 2\nB D 2\nC D 3\nB C 1",refs:[
  ["Ford and Fulkerson, Maximal flow through a network, Canadian J. Math 1956","https://doi.org/10.4153/CJM-1956-045-5"],
  ["Edmonds and Karp, Theoretical improvements in algorithmic efficiency for network flow problems, JACM 1972","https://doi.org/10.1145/321694.321699"],
  ["CLRS, Chapter 24 Maximum Flow","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},
{id:"dinic",title:"Dinic's algorithm",level:5,kind:"Max flow",status:"Concept lesson",
 summary:"Dinic's algorithm uses BFS to build a level graph and blocking flows with DFS. It runs in O(V² E) and is much faster than Edmonds-Karp in practice.",
 mental:"Layered graph plus blocking flow",
 mentalText:"BFS builds layers from source to sink. DFS finds many paths in the layered graph at once. Repeat with a new level graph.",
 steps:["BFS from source to build the level graph (distances in edges).","DFS on the level graph to find a blocking flow.","Add the blocking flow to the total.","Rebuild the level graph and repeat."],
 pseudo:"dinic(G, s, t):\n  flow = 0\n  while bfs_build_levels(G, s, t):\n    while True:\n      path = dfs_blocking(G, s, t)\n      if not path: break\n      push_flow(path)\n  return flow\n\nBFS assigns level[v] = distance from s in residual graph.\nDFS only follows edges from level[v] to level[v+1].\n\nTime: O(V^2 * E)\nOn unit-capacity graphs: O(E * sqrt(V))\nThis is the algorithm used in most libraries (e.g., for bipartite matching).",
 uses:"Bipartite matching, image segmentation, project selection, competitive programming flow problems.",
 strength:"Fast in practice. O(E·sqrt(V)) on unit-capacity graphs.",
 limits:"More complex than Edmonds-Karp. Recursion in DFS can be deep.",
 pitfall:"The DFS must update the level graph as edges saturate. A common bug is not advancing the iterator.",
 question:"What is the role of the level graph in Dinic's algorithm?",
 answer:"The level graph contains only edges that go from level i to level i+1. Shortest augmenting paths are in this graph. DFS finds a blocking flow, so no shorter path is possible.",
 demo:"none",sample:"",refs:[
  ["Dinic, Algorithm for solution of a problem of maximum flow in networks with power estimation, Soviet Math. Dokl. 1970","https://en.wikipedia.org/wiki/Dinic%27s_algorithm"],
  ["Even and Tarjan, Network flow and testing graph connectivity, SIAM J. Comput. 1975","https://doi.org/10.1137/0204043"],
  ["cp-algorithms.com, Dinic's algorithm","https://cp-algorithms.com/graph/dinic.html"]]},
{id:"push-relabel",title:"Push-relabel",level:5,kind:"Max flow",status:"Concept lesson",
 summary:"Push-relabel works locally: each vertex has excess flow and a height label. It pushes flow to lower neighbours and relabels to higher when stuck. It is often the fastest max flow algorithm in practice.",
 mental:"Water pressure in a network of pipes",
 mentalText:"Each vertex stores an excess of water. Push excess to lower neighbours. If nothing can be pushed, raise the vertex.",
 steps:["Set source height to V, all others to 0.","Push all source edges to saturate them.","While there is a vertex with excess:","Try to push excess to a lower neighbour.","If no push is possible, relabel (increase height)."],
 pseudo:"push_relabel(G, s, t):\n  height[s] = |V|\n  excess[v] = 0 for all v\n  for (s, v) in edges: push(s, v)\n\n  while exists v != s, t with excess[v] > 0:\n    if can push to lower neighbour:\n      push\n    else:\n      height[v] = 1 + min(height[u] for u in neighbors(v))\n\n  return excess[t]\n\nGeneric: O(V^2 * E)\nWith highest-label and gap heuristic: O(V^3) or better.",
 uses:"General max flow, image segmentation (Boykov-Kolmogorov is a variant), large network flow.",
 strength:"Often faster than Dinic in practice, especially for large graphs.",
 limits:"More complex to implement and tune.",
 pitfall:"The relabel step must always increase the height. Otherwise the algorithm loops.",
 question:"What is the key invariant in push-relabel?",
 answer:"For every residual edge (u, v), height[u] <= height[v] + 1. Flow only goes downhill in terms of height.",
 demo:"none",sample:"",refs:[
  ["Goldberg and Tarjan, A new approach to the maximum-flow problem, JACM 1988","https://doi.org/10.1145/48014.61051"],
  ["Cherkassky and Goldberg, On implementing push-relabel method for the maximum flow problem, IPCO 1995","https://doi.org/10.1007/3-540-59408-6_39"],
  ["cp-algorithms.com, Push-relabel","https://cp-algorithms.com/graph/push-relabel.html"]]},
{id:"bipartite-matching",title:"Bipartite matching: Hopcroft-Karp",level:5,kind:"Matching",status:"Concept lesson",
 summary:"A matching pairs vertices from two sides so no vertex appears twice. Hopcroft-Karp finds the maximum matching in O(E sqrt(V)) using BFS and DFS layers.",
 mental:"Pairing dancers so nobody is left out",
 mentalText:"Each dancer on the left can pair with certain dancers on the right. Find the maximum number of pairs.",
 steps:["Build the bipartite graph from left to right.","BFS from all unmatched left vertices to layer the graph.","DFS finds augmenting paths through these layers.","Augment matching along the paths.","Repeat until no augmenting path exists."],
 pseudo:"hopcroft_karp(G):\n  match_left = {}, match_right = {}\n  while True:\n    # BFS to find shortest augmenting paths\n    dist = {}\n    queue = []\n    for u in left:\n      if u not in match_left:\n        dist[u] = 0\n        queue.append(u)\n      else:\n        dist[u] = infinity\n\n    while queue:\n      u = queue.pop(0)\n      for v in neighbors(u):\n        if v in match_right and dist[match_right[v]] == infinity:\n          dist[match_right[v]] = dist[u] + 1\n          queue.append(match_right[v])\n\n    # DFS to find augmenting paths\n    def dfs(u):\n      for v in neighbors(u):\n        if v not in match_right or (dist[match_right[v]] == dist[u] + 1 and dfs(match_right[v])):\n          match_left[u] = v\n          match_right[v] = u\n          return True\n      dist[u] = infinity\n      return False\n\n    if not any(dfs(u) for u in left if u not in match_left): break\n\n  return match_left",
 uses:"Job assignment, scheduling, resource allocation, recommendation, online advertising.",
 strength:"O(E sqrt(V)). Much faster than the O(V·E) Hungarian algorithm for unweighted bipartite.",
 limits:"Only for bipartite. Weighted matching needs different algorithms (Hungarian, min-cost flow).",
 pitfall:"A maximal matching is not necessarily maximum. Hopcroft-Karp finds the maximum.",
 question:"What is the size of the largest possible matching in a bipartite graph with 3 left and 5 right vertices?",
 answer:"At most 3 (min of the two sides). A perfect matching on the left side if possible.",
 demo:"none",sample:"",refs:[
  ["Hopcroft and Karp, An n^2.5 algorithm for maximum matchings in bipartite graphs, SIAM J. Comput. 1973","https://doi.org/10.1137/0202019"],
  ["Kuhn, The Hungarian method for the assignment problem, Naval Research Logistics 1955","https://doi.org/10.1002/nav.3800020109"],
  ["CLRS, Section 24.3 Maximum bipartite matching","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},

{id:"stoer-wagner",title:"Stoer-Wagner global min cut",level:5,kind:"Min cut",status:"Concept lesson",
 summary:"Stoer-Wagner finds the global minimum cut of an undirected weighted graph without specifying source or sink. It uses a merge-and-record scheme on maximum adjacency orderings.",
 mental:"Find the weakest way to split the graph in two, without naming a side",
 mentalText:"You want the cut with minimum total weight anywhere in the graph. Stoer-Wagner repeatedly finds the two clusters that are most tightly connected and merges them.",
 steps:["Repeat n-1 times:","Find a maximum adjacency ordering of the current graph.","The last two vertices form the min cut candidate.","Record the cut weight.","Merge the last two vertices."],
 pseudo:"stoer_wagner(G):\n  best_cut = infinity\n  while |V| > 1:\n    A = maximum_adjacency_ordering(G)\n    s, t = A[-2], A[-1]\n    cut_weight = sum of weights from t to others\n    best_cut = min(best_cut, cut_weight)\n    merge t into s\n  return best_cut\n\nmaximum_adjacency_ordering:\n  A = [arbitrary vertex]\n  while len(A) < |V|:\n    pick vertex outside A with max total weight to A\n    add to A\n\nTime: O(V^3) naive, O(V * E + V^2 log V) with heaps.",
 uses:"Network reliability, community detection, image segmentation, finding weak links in infrastructure.",
 strength:"Finds the global min cut. No source or sink needed.",
 limits:"Undirected graphs only. O(V³) is slow for very large graphs.",
 pitfall:"The maximum adjacency ordering is the key. If tie-breaking is wrong, the cut may be suboptimal.",
 question:"What is the minimum cut of a graph that is a single edge of weight 5 between two vertices?",
 answer:"5. Removing the edge splits the graph into two singletons with total cut weight 5.",
 demo:"none",sample:"",refs:[
  ["Stoer and Wagner, A simple min-cut algorithm, JACM 1997","https://doi.org/10.1145/263867.263872"],
  ["Karger, Global min-cuts in RNC and other ramifications of a simple min-cut algorithm, SODA 1993","https://doi.org/10.1145/313559.313852"],
  ["cp-algorithms.com, Stoer-Wagner minimum cut","https://cp-algorithms.com/graph/stoer_wagner_min_cut.html"]]},
{id:"gomory-hu",title:"Gomory-Hu tree",level:5,kind:"Cut tree",status:"Concept lesson",
 summary:"A Gomory-Hu tree is a weighted tree on the same vertices that encodes all pairwise min cuts. Each edge of the tree corresponds to a minimum s-t cut in the original graph.",
 mental:"A tree summary of every possible min cut",
 mentalText:"Instead of computing n(n-1)/2 min cuts, Gomory-Hu uses n-1 max flow computations to build a tree that answers any min cut query.",
 steps:["Start with a star of the source s and all others.","For each edge in the tree, compute min s-t cut in the current graph.","Split the tree according to the cut.","Recurse on each side."],
 pseudo:"gomory_hu(G):\n  tree = star centered at vertex 0\n  for each edge (u, v) in tree:\n    S, T = min_cut(G, u, v)   # partition from max flow\n    weight(u, v) = cut_value\n    split tree edges: for w in S, reconnect its tree edges\n    recurse on subproblems from each side\n  return tree\n\nTime: n-1 max flow computations.\nEach max flow is O(V^2 * E) or faster.",
 uses:"All-pairs min cut queries, network reliability, community detection, information flow.",
 strength:"Compact representation of all min cuts. Answers any query in O(diameter) time.",
 limits:"Expensive: requires n-1 max flow runs.",
 pitfall:"Gomory-Hu works only for undirected weighted graphs. Directed versions exist but are more complex.",
 question:"How many max flow computations does Gomory-Hu need?",
 answer:"n-1, one for each edge of the tree.",
 demo:"none",sample:"",refs:[
  ["Gomory and Hu, Multi-terminal network flows, J. SIAM 1961","https://doi.org/10.1137/0111030"],
  ["Benczur, The structure of near-minimum cuts, 1995","https://doi.org/10.1007/BF01185207"],
  ["Wikipedia, Gomory-Hu tree","https://en.wikipedia.org/wiki/Gomory%E2%80%93Hu_tree"]]},
{id:"bk-mincut",title:"Boykov-Kolmogorov max flow",level:5,kind:"Specialized max flow",status:"Concept lesson",
 summary:"Boykov-Kolmogorov is a max flow algorithm optimized for computer vision graphs. It uses two search trees (from source and sink) that grow and meet to find augmenting paths.",
 mental:"Two search trees that grow and meet",
 mentalText:"One tree grows from the source, the other from the sink. When they meet, an augmenting path is found. The trees reset locally after each augmentation.",
 steps:["Build a tree from the source and a tree from the sink.","Grow the trees along non-saturated edges.","When the trees meet, an augmenting path is found.","Push flow along the path.","Adopt orphaned subtrees back into the trees."],
 pseudo:"boykov_kolmogorov(G, s, t):\n  build trees from s and t\n  while True:\n    grow trees\n    if trees meet at vertex v:\n      augment path from s to t via v\n      update residual\n      adopt or orphan affected vertices\n    else:\n      break\n\nOptimized for grid-like graphs.\nTypical speedup: 3-10x over standard max flow on vision graphs.",
 uses:"Image segmentation, stereo vision, video object tracking, medical imaging.",
 strength:"Very fast on graphs with low connectivity between regions.",
 limits:"Specialized. Not faster than Dinic or push-relabel on general graphs.",
 pitfall:"The algorithm assumes non-negative capacities. Negative capacities break the tree growth logic.",
 question:"Why is Boykov-Kolmogorov fast for image segmentation?",
 answer:"Image graphs are grid-like with a small cut between foreground and background. The two-tree approach finds this small cut quickly.",
 demo:"none",sample:"",refs:[
  ["Boykov and Kolmogorov, An experimental comparison of min-cut/max-flow algorithms for energy minimization in vision, IEEE TPAMI 2004","https://doi.org/10.1109/TPAMI.2004.60"],
  ["Boykov and Jolly, Interactive graph cuts for optimal boundary and region segmentation of objects in N-D images, ICCV 2001","https://doi.org/10.1109/ICCV.2001.937505"],
  ["Kolmogorov and Zabih, What energy functions can be minimized via graph cuts?, IEEE TPAMI 2004","https://doi.org/10.1109/TPAMI.2004.1262177"]]},
{id:"mincut-duality",title:"Min-cut and max-flow duality",level:4,kind:"Theorem",status:"Concept lesson",
 summary:"The max-flow min-cut theorem states that the maximum flow from source to sink equals the minimum capacity of an s-t cut. This is a foundational result in combinatorial optimization.",
 mental:"The bottleneck that limits the flow",
 mentalText:"However much you push, the total cannot exceed the capacity of any cut. There exists a cut that exactly equals the maximum flow.",
 steps:["Any s-t cut partitions vertices into S (containing s) and T (containing t).","The cut capacity is the sum of capacities of edges from S to T.","Max flow <= min cut capacity (weak duality).","When no augmenting path exists, the reachable set from s in the residual graph is a cut of equal value (strong duality)."],
 pseudo:"Max-flow min-cut theorem:\n  max_{f} |f|  =  min_{(S, T)} capacity(S, T)\n\nGiven max flow f:\n  S = vertices reachable from s in residual graph of f\n  T = V - S\n  Cut (S, T) has capacity = |f|\n\nConsequences:\n  - Ford-Fulkerson termination proves the theorem\n  - LP duality (max-flow = min-cut is a special case)\n  - Integral flow theorem: with integer capacities, there is an integral max flow",
 uses:"Proving optimality of flow, image segmentation, project selection, bipartite matching (Konig's theorem).",
 strength:"Powerful theoretical tool. Provides certificates of optimality.",
 limits:"Does not directly give the algorithm; relies on max flow or LP solvers.",
 pitfall:"The theorem is for s-t cuts. Global min cut (any partition) is a different problem (Stoer-Wagner).",
 question:"What certificate does max flow give that the flow is optimal?",
 answer:"A cut whose capacity equals the flow value. No flow can exceed any cut, so this proves optimality.",
 demo:"none",sample:"",refs:[
  ["Ford and Fulkerson, Max-flow min-cut theorem, Canadian J. Math 1956","https://doi.org/10.4153/CJM-1956-045-5"],
  ["Elias, Feinstein, Shannon, A note on the maximum flow through a network, IRE Trans. 1956","https://doi.org/10.1109/TIT.1956.1056816"],
  ["CLRS, Section 24.2 The max-flow min-cut theorem","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"]]},

{id:"euler-path",title:"Euler paths and circuits",level:4,kind:"Traversal",status:"Runnable teaching lab",
 summary:"An Euler path uses every edge exactly once. It exists in a connected graph if 0 or 2 vertices have odd degree. Hierholzer builds it in O(E) using DFS with edge removal.",
 mental:"Drawing the whole picture without lifting your pen",
 mentalText:"You want to trace every line exactly once. Euler paths exist when the graph has at most two odd-degree vertices.",
 steps:["Check degree counts: 0 odd means an Euler circuit, 2 odd means an Euler path.","Start from an odd-degree vertex (or any vertex for a circuit).","Hierholzer: DFS, removing edges as you go.","When you get stuck, backtrack and prepend the path."],
 pseudo:"hierholzer(G):\n  stack = [start]\n  path = []\n  while stack:\n    v = stack[-1]\n    if any unvisited edge from v:\n      take it and remove it from G\n      stack.append(other endpoint)\n    else:\n      path.append(stack.pop())\n  return reversed(path)\n\nConditions:\n  Euler circuit: all degrees even, graph connected\n  Euler path: exactly 0 or 2 odd-degree vertices\n  Directed version: in-degree == out-degree for circuit,\n                   one vertex with out = in + 1, one with in = out + 1 for path",
 uses:"Route inspection, DNA fragment assembly, puzzle solving, circuit testing.",
 strength:"Linear time.",
 limits:"Only exists when degree conditions are met. Not all graphs have an Euler path.",
 pitfall:"Fleury's algorithm also works but is O(E²). Use Hierholzer for efficiency.",
 question:"Does the complete graph K5 have an Euler circuit?",
 answer:"Yes. Every vertex has degree 4 which is even. So an Euler circuit exists.",
 demo:"euler-path",sample:"A B\nB C\nC D\nD A\nA C",refs:[
  ["Hierholzer and Wiener, Uber die Moglichkeit, einen Linienzug ohne Wiederholung und ohne Unterbrechung zu umfahren, Math. Ann. 1873","https://doi.org/10.1007/BF01442866"],

{id:"tsp-heuristics",title:"TSP heuristics",level:4,kind:"NP-hard problem",status:"Runnable teaching lab",
 summary:"TSP asks for the shortest tour visiting every city once. It is NP-hard. Heuristics like nearest neighbour, greedy edge, and Christofides give fast approximate solutions.",
 mental:"A traveling salesman trying to visit every city and return home cheaply",
 mentalText:"Finding the exact optimum is hard for large instances. Good heuristics get close quickly.",
 steps:["Nearest neighbour: from the current city, go to the closest unvisited.","Greedy edge: sort edges by weight, add if they do not form a premature cycle.","Christofides: compute MST + minimum matching for 1.5-approximation.","2-opt: swap two edges to reduce tour length until no improvement."],
 pseudo:"nearest_neighbor(G, start):\n  tour = [start]\n  visited = {start}\n  while len(tour) < |V|:\n    last = tour[-1]\n    next = argmin over unvisited neighbors of last of weight\n    tour.append(next); visited.add(next)\n  return tour\n\ngreedy_edge(G):\n  sort edges by weight\n  tour_edges = []\n  uf = UnionFind(V)\n  for (u, v, w) in sorted_edges:\n    if degree[u] < 2 and degree[v] < 2 and uf.find(u) != uf.find(v):\n      tour_edges.append((u, v))\n      uf.union(u, v)\n      degree[u] += 1; degree[v] += 1\n\nChristofides:\n  T = MST(G)\n  O = odd-degree vertices of T\n  M = minimum weight perfect matching on O\n  H = T + M\n  find Eulerian circuit\n  shortcut to get Hamiltonian cycle\n  Approximation ratio: 1.5",
 uses:"Logistics, delivery routes, circuit board drilling, genome sequencing, warehouse picking.",
 strength:"Heuristics run fast. Christofides has a provable 1.5 approximation for metric TSP.",
 limits:"NP-hard: no polynomial-time exact algorithm is known. Christofides only for metric TSP.",
 pitfall:"Nearest neighbour can produce very bad tours (up to O(log n) factor worse than optimum in the worst case).",
 question:"What is the approximation ratio of Christofides?",
 answer:"1.5. The tour it produces is at most 50% longer than the optimal tour (for metric TSP).",
 demo:"tsp",sample:"A B 10\nA C 15\nA D 20\nB C 35\nB D 25\nC D 30",refs:[
  ["Christofides, Worst-case analysis of a new heuristic for the travelling salesman problem, 1976","https://www.cs.cmu.edu/~haeupler/15859F20/papers/christofides.pdf"],
  ["Applegate et al., The Traveling Salesman Problem: A Computational Study, Princeton 2006","https://press.princeton.edu/books/hardcover/9780691129938/the-traveling-salesman-problem"],
  ["Wikipedia, Travelling salesman problem","https://en.wikipedia.org/wiki/Travelling_salesman_problem"]]},
{id:"christofides",title:"Christofides algorithm",level:5,kind:"Approximation algorithm",status:"Concept lesson",
 summary:"Christofides gives a 1.5 approximation for metric TSP by combining a minimum spanning tree with a minimum perfect matching on odd-degree vertices, then shortcutting an Euler tour.",
 mental:"MST plus matching plus shortcut",
 mentalText:"The MST connects everything cheaply. The matching fixes the odd-degree vertices so an Euler tour exists. Shortcuts turn the Euler tour into a Hamiltonian cycle.",
 steps:["Compute the MST of the graph.","Find odd-degree vertices of the MST (there is always an even number).","Compute minimum weight perfect matching on those vertices.","Combine MST and matching into one graph.","Find an Eulerian circuit.","Shortcut to get a Hamiltonian cycle."],
 pseudo:"christofides(G):\n  T = MST(G)\n  O = [v for v in V if degree_T(v) is odd]\n  M = min_weight_perfect_matching(G, O)\n  H = T + M\n  # H has all even degrees\n  tour = euler_tour(H)\n  # shortcut to get a Hamiltonian cycle\n  result = []\n  seen = set()\n  for v in tour:\n    if v not in seen:\n      result.append(v)\n      seen.add(v)\n  return result\n\nApproximation ratio: 1.5\nBest known for general metric TSP until recently (2020).",
 uses:"Route planning, logistics, generic metric TSP.",
 strength:"Provable 1.5-approximation. The best classical bound for 40 years.",
 limits:"Requires metric TSP (triangle inequality). Only practical for small to medium instances.",
 pitfall:"The minimum weight perfect matching step is the expensive part. Blossom algorithm is O(V³).",
 question:"Why must the number of odd-degree vertices be even?",
 answer:"The sum of all degrees in a graph is 2E (even). If odd-degree vertices had an odd sum, this would contradict. So the count is even.",
 demo:"none",sample:"",refs:[
  ["Christofides, Worst-case analysis of a new heuristic for the travelling salesman problem, 1976","https://www.cs.cmu.edu/~haeupler/15859F20/papers/christofides.pdf"],
  ["Karlin, Klein, Oveis Gharan, A (slightly) improved approximation algorithm for metric TSP, STOC 2021","https://doi.org/10.1145/3406325.3451009"],
  ["Wikipedia, Christofides algorithm","https://en.wikipedia.org/wiki/Christofides_algorithm"]]},
{id:"two-opt-lk",title:"2-opt and Lin-Kernighan",level:5,kind:"Local search",status:"Concept lesson",
 summary:"2-opt improves a tour by removing two edges and reconnecting the remaining paths. Lin-Kernighan generalizes to variable k-opt moves and is one of the best TSP heuristics.",
 mental:"Untangling a knotted loop",
 mentalText:"If two edges cross, swapping them makes the tour shorter (in Euclidean TSP). Repeat until no improvement.",
 steps:["2-opt: try removing two edges (a, b) and (c, d).","Reconnect as (a, c) and (b, d).","Accept if the new tour is shorter.","Repeat until no improving 2-opt move exists.","Lin-Kernighan: recursively try k-opt moves with a greedy depth-first search."],
 pseudo:"two_opt(tour, G):\n  improved = True\n  while improved:\n    improved = False\n    for i in range(len(tour) - 1):\n      for j in range(i + 2, len(tour)):\n        a, b = tour[i], tour[i + 1]\n        c, d = tour[j], tour[(j + 1) % len(tour)]\n        if dist(a, b) + dist(c, d) > dist(a, c) + dist(b, d):\n          reverse tour[i+1:j+1]\n          improved = True\n  return tour\n\nTime per pass: O(V^2).\nUsually converges in a few passes.",
 uses:"TSP local search, vehicle routing, circuit board routing.",
 strength:"Simple and effective. 2-opt alone often gets within a few percent of optimum.",
 limits:"Local optimum may not be global. Lin-Kernighan is more complex but stronger.",
 pitfall:"2-opt on a non-metric TSP can make the tour longer. The Euclidean shortcut only holds for metric distances.",
 question:"Why does 2-opt work well for Euclidean TSP?",
 answer:"Crossing edges can always be uncrossed by a 2-opt move that reduces total length (triangle inequality). So a locally optimal tour has no crossings.",
 demo:"none",sample:"",refs:[
  ["Croes, A method for solving traveling-salesman problems, Operations Research 1958","https://doi.org/10.1287/opre.6.6.791"],
  ["Lin and Kernighan, An effective heuristic algorithm for the traveling-salesman problem, Operations Research 1973","https://doi.org/10.1287/opre.21.2.498"],
  ["Helsgaun, An effective implementation of the Lin-Kernighan traveling salesman heuristic, EJOR 2000","https://doi.org/10.1016/S0377-2217(99)00284-2"]]},
{id:"chinese-postman",title:"Chinese postman problem",level:5,kind:"Routing",status:"Concept lesson",
 summary:"The Chinese postman finds the shortest closed walk that uses every edge at least once. It reduces to finding a minimum weight perfect matching on odd-degree vertices.",
 mental:"A postman who must deliver on every street",
 mentalText:"Unlike the Euler path, you may reuse edges. You want the shortest route that covers every edge.",
 steps:["If all degrees are even, any Euler circuit works.","Otherwise, find odd-degree vertices.","Compute shortest paths between all pairs of odd vertices.","Find a minimum weight perfect matching on the odd vertices.","Double the matched paths to make all degrees even."],
 pseudo:"chinese_postman(G):\n  odd = [v for v in V if degree(v) is odd]\n  if not odd:\n    return euler_circuit(G)\n\n  # compute all-pairs shortest paths\n  D = floyd_warshall(G)\n\n  # minimum weight perfect matching on odd vertices\n  matching = min_weight_perfect_matching(odd, D)\n\n  # duplicate matched shortest paths\n  for (u, v) in matching:\n    duplicate edges along shortest path u -> v\n\n  return euler_circuit(G)   # now all degrees are even\n\nPolynomial time. Reduces to matching.",
 uses:"Street sweeping, garbage collection, mail delivery, snow ploughing, circuit testing.",
 strength:"Polynomial time. Optimal for undirected graphs.",
 limits:"Directed version is NP-hard.",
 pitfall:"The number of odd-degree vertices is always even. If it is zero, the graph already has an Euler circuit.",
 question:"What is the minimum matching step needed for?",
 answer:"To pair up odd-degree vertices so we can double the shortest paths between them. This makes every vertex have even degree, which allows an Euler circuit.",
 demo:"none",sample:"",refs:[
  ["Guan, Graphic programming using odd or even points, Chinese Math. 1962","https://en.wikipedia.org/wiki/Route_inspection_problem"],
  ["Edmonds and Johnson, Matching, Euler tours and the Chinese postman, Math. Programming 1973","https://doi.org/10.1007/BF01580113"],
  ["Eiselt, Gendreau, Laporte, Arc routing problems, Operations Research 1995","https://doi.org/10.1287/opre.43.2.231"]]},

{id:"lca",title:"LCA with binary lifting",level:4,kind:"Tree algorithm",status:"Runnable teaching lab",
 summary:"LCA finds the lowest common ancestor of two nodes in a rooted tree. Binary lifting precomputes 2^k ancestors per node so LCA queries are O(log n).",
 mental:"Climbing both branches at the same rate until they meet",
 mentalText:"Bring both nodes to the same depth. Then lift both together until their parents match. The meeting point is the LCA.",
 steps:["Root the tree and compute depth for each node.","Precompute up[k][v]: 2^k-th ancestor of v.","LCA(u, v): bring u up to depth of v (or vice versa).","If u == v, return u.","Lift both by the largest k where up[k][u] != up[k][v].","Return the parent of the meeting point."],
 pseudo:"preprocess(root):\n  depth[root] = 0\n  up[0][root] = root\n  for v in BFS order:\n    for k in 1..LOG-1:\n      up[k][v] = up[k-1][up[k-1][v]]\n\nlca(u, v):\n  if depth[u] < depth[v]: swap(u, v)\n  diff = depth[u] - depth[v]\n  for k in 0..LOG-1:\n    if diff & (1 << k): u = up[k][u]\n  if u == v: return u\n  for k in reversed(range(LOG)):\n    if up[k][u] != up[k][v]:\n      u = up[k][u]\n      v = up[k][v]\n  return up[0][u]\n\nPreprocessing: O(n log n)\nEach query: O(log n)",
 uses:"Tree path queries, LCA-based distance, tree edit distance, offline query batching, network routing.",
 strength:"Fast queries after preprocessing. Simple to implement.",
 limits:"Preprocessing needs O(n log n) memory.",
 pitfall:"LCA requires a rooted tree. Unrooted trees need an arbitrary root first.",
 question:"Given two nodes at depth 10 and 7 in a tree, what is the first step?",
 answer:"Bring the deeper node (depth 10) up by 3 levels so both are at depth 7. Then compare.",
 demo:"lca",sample:"root A\nA B\nA C\nB D\nB E\nC F\nC G\nquery D E\nquery D F\nquery E G",refs:[
  ["Bender and Farach-Colton, The LCA problem revisited, LATIN 2000","https://doi.org/10.1007/10719839_9"],
  ["Harel and Tarjan, Fast algorithms for finding nearest common ancestors, SIAM J. Comput. 1984","https://doi.org/10.1137/0213024"],
  ["cp-algorithms.com, Lowest common ancestor","https://cp-algorithms.com/graph/lca.html"]]},
{id:"hld",title:"Heavy-light decomposition",level:5,kind:"Tree decomposition",status:"Concept lesson",
 summary:"HLD splits a tree into heavy paths. Any root-to-leaf path uses O(log n) heavy paths. Combined with segment trees, it answers path queries in O(log² n).",
 mental:"Breaking the tree into long chains",
 mentalText:"Each node passes its heavy child (largest subtree) the same chain. The rest start new chains. This limits how many chains a path crosses.",
 steps:["Compute subtree sizes.","For each node, the heavy child is the one with the largest subtree.","Assign chain IDs: same chain as parent if heavy, new chain if light.","For path query: lift the deeper chain head, query the segment, repeat."],
 pseudo:"decompose(root):\n  compute_subtree_sizes(root)\n  # heavy child = child with max subtree size\n\n  assign_chains(root):\n    for each child c of v:\n      if c is heavy child:\n        chain[c] = chain[v]\n      else:\n        chain[c] = c   # new chain starts here\n\npath_query(u, v, query_fn):\n  while chain[u] != chain[v]:\n    if depth[chain[u]] < depth[chain[v]]:\n      u, v = v, u\n    query_fn(pos[chain[u]], pos[u])   # position in segment tree\n    u = parent[chain[u]]\n  if depth[u] > depth[v]: u, v = v, u\n  query_fn(pos[u], pos[v])\n\nPreprocessing: O(n)\nEach path query: O(log^2 n) with a segment tree",
 uses:"Path queries on trees, dynamic programming on trees, offline subtree queries.",
 strength:"Turns tree paths into O(log n) segment ranges.",
 limits:"Requires a static tree. Dynamic trees need link-cut trees.",
 pitfall:"The position array must place nodes of the same chain consecutively so segment tree queries are contiguous.",
 question:"How many chains does a root-to-leaf path cross?",
 answer:"O(log n). Each light edge halves the subtree size, so at most log2(n) light edges on any path.",
 demo:"none",sample:"",refs:[
  ["Harel and Tarjan, Fast algorithms for finding nearest common ancestors, SIAM J. Comput. 1984","https://doi.org/10.1137/0213024"],
  ["Sleator and Tarjan, A data structure for dynamic trees, JCSS 1983","https://doi.org/10.1016/0022-0000(83)90006-5"],

{id:"centroid",title:"Centroid decomposition",level:5,kind:"Tree decomposition",status:"Concept lesson",
 summary:"Centroid decomposition recursively splits a tree at its centroid, giving O(log n) levels. It answers path queries that would otherwise be O(n) per query.",
 mental:"Find the middle of the tree and cut it",
 mentalText:"The centroid is the node whose removal leaves the smallest largest component. Remove it, recurse on the pieces. Depth is O(log n).",
 steps:["Find the centroid of the current tree.","Remove it.","Recurse on each remaining component.","Path queries pass through the centroid, so store per-level information."],
 pseudo:"centroid_decompose(tree):\n  n = size of tree\n  centroid = find_centroid(tree)\n  process(centroid)\n  for each subtree of centroid:\n    centroid_decompose(subtree)\n\nfind_centroid(v):\n  compute_subtree_sizes(v)\n  # move towards the child with the largest subtree\n  while any child has size > n/2:\n    v = that child\n  return v\n\nDepth: O(log n)\nTotal work per path query: O(log n) or O(log^2 n)",
 uses:"Tree path counting, distances, k-th node on a path, offline queries.",
 strength:"Logarithmic depth. Each node has O(log n) ancestors in the centroid tree.",
 limits:"Preprocessing is O(n log n). Query handling depends on the problem.",
 pitfall:"The centroid is not the middle of the longest path. It is the node that minimizes the largest remaining component.",
 question:"Why is the depth of a centroid decomposition O(log n)?",
 answer:"Each recursion halves the largest component. After log2(n) levels, the largest component has size 1.",
 demo:"none",sample:"",refs:[
  ["Bender and Farach-Colton, The LCA problem revisited, LATIN 2000","https://doi.org/10.1007/10719839_9"],
  ["cp-algorithms.com, Centroid decomposition","https://cp-algorithms.com/graph/centroid_decomposition.html"],

{id:"euler-tour",title:"Euler tour trees",level:5,kind:"Dynamic tree",status:"Concept lesson",
 summary:"An Euler tour tree represents a tree as an Euler tour of its edges. It supports link, cut, and subtree queries in O(log n) using a balanced BST.",
 mental:"Representing a tree as a circular tour",
 mentalText:"The Euler tour visits each edge twice. This tour can be stored in a balanced BST. Linking and cutting corresponds to splitting and joining the tour.",
 steps:["Build the Euler tour of the tree (visit edges twice).","Store the tour in a balanced BST.","Link: join the tours at the right positions.","Cut: split the tour at the edge.","Subtree query: find the contiguous segment for a node's subtree."],
 pseudo:"euler_tour_tree(tree):\n  tour = euler_tour(tree)   # sequence of nodes (2n entries)\n  bst = BalancedBST(tour)\n\nlink(u, v):\n  # find occurrence of u and v in tour\n  join the two tours at the right spots\n\ncut(u, v):\n  split the tour at the edge\n\nsubtree_query(v):\n  find the segment of tour between first and last occurrence of v\n  query the BST over that segment\n\nAll operations: O(log n)",
 uses:"Dynamic connectivity, link-cut tree applications, dynamic tree DP.",
 strength:"All tree operations in O(log n).",
 limits:"Requires a balanced BST with split and join. More complex than static Euler tour.",
 pitfall:"Each node appears twice in the tour (once on entry, once on exit). Subtree queries use the range between the two.",
 question:"How many entries does an Euler tour of a tree with n nodes have?",
 answer:"2(n-1) + 1 = 2n - 1 for the edge tour, or 2n if you include the return to the root.",
 demo:"none",sample:"",refs:[
  ["Henzinger and King, Randomized dynamic graph algorithms with polylogarithmic time per operation, STOC 1995","https://doi.org/10.1145/225058.225269"],
  ["Sleator and Tarjan, A data structure for dynamic trees, JCSS 1983","https://doi.org/10.1016/0022-0000(83)90006-5"],

{id:"prufer",title:"Prüfer codes",level:4,kind:"Tree encoding",status:"Runnable teaching lab",
 summary:"A Prüfer code encodes a labeled tree on n vertices as a sequence of n-2 numbers. This gives a bijection between labeled trees and sequences, and proves Cayley's formula n^(n-2).",
 mental:"A compact number that describes a tree",
 mentalText:"Any labeled tree can be encoded by repeatedly removing the smallest leaf and recording its neighbour. The result is a sequence of length n-2.",
 steps:["Find the smallest leaf in the tree.","Append its neighbour to the code.","Remove the leaf.","Repeat until only two vertices remain.","The code has n-2 entries."],
 pseudo:"to_prufer(tree):\n  code = []\n  while len(tree) > 2:\n    leaf = smallest leaf\n    code.append(neighbor of leaf)\n    remove leaf\n  return code\n\nfrom_prufer(code):\n  n = len(code) + 2\n  degree = [1] * n\n  for x in code: degree[x] += 1\n  tree = []\n  for x in code:\n    leaf = smallest vertex with degree 1\n    tree.append((leaf, x))\n    degree[leaf] -= 1\n    degree[x] -= 1\n  # add the last edge\n  remaining = [v for v in range(n) if degree[v] == 1]\n  tree.append((remaining[0], remaining[1]))\n  return tree",
 uses:"Random tree generation, counting trees, coding theory, tree isomorphism.",
 strength:"Compact encoding. Bijection gives counting results.",
 limits:"Only for labeled trees. Unlabeled trees need canonical forms.",
 pitfall:"The Prüfer code is length n-2, not n-1 or n. This is what makes Cayley's formula give n^(n-2).",
 question:"How many labeled trees are there on 4 vertices?",
 answer:"4^(4-2) = 16. Cayley's formula gives n^(n-2).",
 demo:"prufer",sample:"A B\nA C\nA D\nB E",refs:[
  ["Prüfer, Neuer Beweis eines Satzes über Permutationen, Arch. Math. Phys. 1918","https://en.wikipedia.org/wiki/Pr%C3%BCfer_sequence"],
  ["Cayley, A theorem on trees, Quart. J. Math. 1889","https://doi.org/10.1007/978-3-642-61726-2_33"],

{id:"vf2",title:"VF2 subgraph isomorphism",level:5,kind:"Graph matching",status:"Concept lesson",
 summary:"VF2 determines whether a pattern graph appears inside a target graph. It does a backtracking search with feasibility rules that prune most of the search space.",
 mental:"Finding a template in a large network",
 mentalText:"You have a small pattern and a big graph. VF2 tries to match pattern vertices to graph vertices one at a time, backtracking when no valid match exists.",
 steps:["Match the pattern vertex by vertex.","For each candidate, check feasibility: degrees, edges, adjacency.","Prune if the match cannot be extended.","Backtrack when no valid extension exists.","Return the first match or all matches."],
 pseudo:"vf2(pattern, target):\n  state = empty matching\n  candidates = all target vertices\n\n  def match(state):\n    if state covers all pattern vertices:\n      return True\n    next_pattern = pick next pattern vertex (heuristic order)\n    for target_v in candidates_for(next_pattern):\n      if feasible(state, next_pattern, target_v):\n        state.add(next_pattern -> target_v)\n        if match(state): return True\n        state.remove(next_pattern)\n    return False\n\nFeasibility rules:\n  - degree pattern >= degree target\n  - all matched neighbors have matching edges\n  - all unmatched pattern neighbors have candidate targets",
 uses:"Subgraph querying, chemical compound matching, social network motifs, code similarity.",
 strength:"Exact. Pruning is very effective on real graphs.",
 limits:"NP-hard in general. Exponential in the worst case.",
 pitfall:"The order of pattern vertices matters. Match the most constrained vertex first.",
 question:"Why is VF2 backtracking efficient?",
 answer:"The feasibility rules prune branches where no valid match is possible. On real graphs the pruning is very strong.",
 demo:"none",sample:"",refs:[
  ["Cordella et al., A (sub)graph isomorphism algorithm for matching large graphs, IEEE TPAMI 2004","https://doi.org/10.1109/TPAMI.2004.75"],
  ["Ullmann, An algorithm for subgraph isomorphism, JACM 1976","https://doi.org/10.1145/321921.321925"],
  ["Wikipedia, Subgraph isomorphism problem","https://en.wikipedia.org/wiki/Subgraph_isomorphism_problem"]]},
{id:"weisfeiler-leman",title:"Weisfeiler-Leman algorithm",level:5,kind:"Graph isomorphism",status:"Concept lesson",
 summary:"The Weisfeiler-Leman (WL) test iteratively refines a colouring of graph vertices. If two graphs get different stable colourings, they are not isomorphic. Matching colourings do not prove isomorphism.",
 mental:"Iteratively colouring vertices by their neighborhoods",
 mentalText:"Start with all vertices the same colour. At each round, colour a vertex by the multiset of its neighbours' colours. Repeat until colours stabilize.",
 steps:["Colour all vertices with the same initial label.","For each vertex, collect the multiset of neighbours' colours.","Hash this multiset with the vertex's own colour.","Assign a new colour to each vertex.","Repeat until colours stabilize."],
 pseudo:"wl_1(G):\n  color = {v: 0 for v in V}\n  while True:\n    new_color = {}\n    for v in V:\n      signature = (color[v], sorted([color[u] for u in neighbors(v)]))\n      new_color[v] = hash(signature)\n    if partition of new_color is same as color:\n      break\n    color = new_color\n  return color\n\nTime per round: O(E)\nNumber of rounds: at most |V|",
 uses:"Graph isomorphism test (necessary condition), graph kernels, GNN expressiveness analysis.",
 strength:"Fast preprocessing. Distinguishes most non-isomorphic graph pairs.",
 limits:"Cannot distinguish all non-isomorphic graphs. Known counterexamples for high-symmetry graphs.",
 pitfall:"Matching WL colourings do not prove isomorphism. You need a full isomorphism algorithm.",
 question:"What does WL tell you if two graphs get different stable colourings?",
 answer:"They are not isomorphic. WL is a necessary condition, not sufficient.",
 demo:"wl",sample:"A B\nA C\nB C\nD E\nD F\nE F",refs:[
  ["Weisfeiler and Leman, A reduction of a graph to a canonical form, 1968","https://www.iti.zcu.cz/wl2018/pdf/wl_paper_translation.pdf"],
  ["Cai, Fürer, Immerman, An optimal lower bound on the number of variables for graph identification, Combinatorica 1992","https://doi.org/10.1007/BF01285819"],
  ["Morris et al., Weisfeiler and Leman go neural, AAAI 2019","https://doi.org/10.1609/aaai.v33i01.33014602"]]},
{id:"nauty",title:"nauty and canonical labeling",level:5,kind:"Graph isomorphism",status:"Concept lesson",
 summary:"nauty computes a canonical labeling of a graph, so two graphs are isomorphic if and only if they have the same canonical form. It is the standard tool for graph isomorphism in practice.",
 mental:"A unique fingerprint for a graph up to relabeling",
 mentalText:"The canonical form is the lexicographically smallest adjacency matrix over all relabelings. Two graphs are isomorphic iff their canonical forms match.",
 steps:["Search over vertex orderings.","Prune using automorphism and invariant.","When a leaf is reached, compute the adjacency matrix.","Keep the lexicographically smallest one.","Return that as the canonical form."],
 pseudo:"nauty(G):\n  best = None\n  for each leaf in the search tree:\n    canonical = adjacency_matrix_under_this_ordering(G)\n    if best is None or canonical < best:\n      best = canonical\n  return best\n\nSearch tree is pruned by:\n  - vertex invariants (degree, neighborhood counts)\n  - automorphisms of already-found canonical form\n\nPractical performance: handles graphs with millions of vertices in many cases.",
 uses:"Graph database indexing, chemistry (structure search), code similarity, network motif detection.",
 strength:"Very fast on practical graphs. Authoritative canonical form.",
 limits:"Exponential worst case. Some highly symmetric graphs are hard.",
 pitfall:"Canonical labeling is not the same as a graph invariant. Two different canonical algorithms give different forms but the same equivalence classes.",
 question:"What is the canonical form of a graph?",
 answer:"A unique representation of the graph up to isomorphism. Two graphs are isomorphic if and only if their canonical forms match exactly.",
 demo:"none",sample:"",refs:[
  ["McKay and Piperno, Practical graph isomorphism, II, J. Symbolic Computation 2014","https://doi.org/10.1016/j.jsc.2013.09.003"],
  ["Babai, Graph isomorphism in quasipolynomial time, STOC 2016","https://doi.org/10.1145/2897518.2897542"],
